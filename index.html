<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BitLife - Ultimate Life Simulator Expanded</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #070c14;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 920px;
            background-color: #0b1726;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 50px rgba(0,0,0,0.95);
            position: relative;
            overflow: hidden;
        }

        /* BITLIFE TOPBAND */
        .bitlife-topband {
            background: linear-gradient(180deg, #ffcc00 0%, #e6b800 100%);
            color: #000000;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 3px solid #b38f00;
        }
        .bitlife-topband h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }
        .bitlife-topband .subtitle {
            font-size: 12px;
            font-weight: 800;
            margin-top: 2px;
            color: #1a1a1a;
        }
        .bitlife-finance-bar {
            background-color: #002244;
            color: #ffffff;
            padding: 7px 14px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 800;
            border-bottom: 2px solid #001122;
        }

        /* LOG BOX */
        .log-box {
            flex-grow: 1;
            padding: 12px;
            overflow-y: auto;
            background: #08101c;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
        }
        .log-entry {
            background: #122238;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.45;
            border-left: 5px solid #ffcc00;
            color: #e2e8f0;
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .log-entry.good { border-left-color: #22c55e; }
        .log-entry.bad { border-left-color: #ef4444; }
        .log-entry.love { border-left-color: #ec4899; }
        .log-entry.crime { border-left-color: #a855f7; }
        .log-entry.ghost { border-left-color: #00bcd4; }
        .log-entry.school { border-left-color: #3b82f6; }

        /* NAV BAR */
        .nav-bar {
            display: flex;
            background-color: #001f3f;
            height: 70px;
            align-items: center;
            position: relative;
            border-top: 2px solid #003366;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 9px;
            font-weight: 800;
            background: none;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }
        
        .age-btn-wrapper {
            position: relative;
            z-index: 50;
            margin-top: -28px;
        }
        .age-btn {
            width: 80px;
            height: 80px;
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            border: 4px solid #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 900;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: transform 0.08s ease;
        }
        .age-btn:active { transform: scale(0.92); }
        .age-btn .plus-icon { font-size: 24px; line-height: 1; font-weight: 900; }
        .age-btn .age-text { font-size: 11px; letter-spacing: 0.5px; }

        /* STATS BARS */
        .stats-section {
            background-color: #050a10;
            padding: 9px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px solid #122238;
        }
        .stat-row { display: flex; align-items: center; }
        .stat-label { width: 95px; font-size: 10.5px; font-weight: 900; color: #94a3b8; text-transform: uppercase; }
        .stat-bar-bg {
            flex-grow: 1;
            height: 10px;
            background-color: #1e293b;
            border-radius: 5px;
            overflow: hidden;
        }
        .stat-bar-fill { height: 100%; transition: width 0.3s ease; }
        .fill-happy { background: #eab308; }
        .fill-health { background: #22c55e; }
        .fill-smart { background: #3b82f6; }
        .fill-looks { background: #ec4899; }

        /* MODALS & OVERLAYS */
        .bitlife-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff;
            color: #000000;
            z-index: 200;
            flex-direction: column;
        }
        .bitlife-header {
            background: #001f3f;
            color: white;
            padding: 13px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .bitlife-header h2 {
            margin: 0; font-size: 16px; font-weight: 900; text-transform: uppercase;
        }
        .bitlife-close-btn {
            background: rgba(255,255,255,0.2); border: none; color: white;
            width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer;
        }
        .bitlife-menu-list { flex-grow: 1; overflow-y: auto; background: #f8fafc; }

        .bitlife-item {
            display: flex; align-items: center; padding: 13px 16px;
            border-bottom: 1px solid #e2e8f0; cursor: pointer; background: #ffffff;
        }
        .bitlife-item:active { background: #f1f5f9; }
        .bitlife-item-icon { font-size: 22px; margin-right: 12px; width: 28px; text-align: center; }
        .bitlife-item-text { flex-grow: 1; }
        .bitlife-item-title { font-weight: 800; font-size: 13.5px; color: #0f172a; }
        .bitlife-item-sub { font-size: 11.5px; color: #64748b; margin-top: 1px; }
        .bitlife-item-arrow { color: #001f3f; font-weight: bold; font-size: 13px; }

        .bitlife-divider {
            background: #475569; color: white; padding: 6px 16px;
            font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .choice-overlay {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88); z-index: 300;
            justify-content: center; align-items: center; padding: 20px;
        }
        .choice-card {
            background: #ffffff; color: #000000; width: 100%;
            border-radius: 14px; padding: 22px; text-align: center;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
        }
        .choice-icon { font-size: 44px; margin-bottom: 8px; }
        .choice-title { font-size: 18px; font-weight: 900; color: #001f3f; margin-bottom: 6px; }
        .choice-desc { font-size: 13px; color: #334155; margin-bottom: 18px; line-height: 1.45; }
        .choice-option-btn {
            width: 100%; padding: 12px; margin-bottom: 9px;
            background: #001f3f; color: white; border: none;
            border-radius: 7px; font-weight: 800; font-size: 13px; cursor: pointer;
        }
        .choice-option-btn:last-child { margin-bottom: 0; }
        .choice-option-btn.danger { background: #ef4444; }
        .choice-option-btn.secondary { background: #64748b; }
        .choice-option-btn.success { background: #22c55e; }

        .death-screen {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #0f172a; color: white; z-index: 500;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center;
        }
        .tombstone {
            background: #334155; border: 4px solid #475569;
            border-top-left-radius: 100px; border-top-right-radius: 100px;
            width: 250px; padding: 45px 20px 25px 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9); margin-bottom: 25px;
        }
        .tombstone h2 { margin: 0; font-size: 26px; font-weight: 900; color: #f8fafc; }
        .tombstone p { margin: 6px 0; font-size: 13.5px; color: #cbd5e1; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="bitlife-topband">
        <h1 id="char-name">Henri Daher</h1>
        <div class="subtitle" id="char-job">Schüler</div>
    </div>
    <div class="bitlife-finance-bar">
        <span>ALTER: <strong id="char-age">14</strong></span>
        <span>BANK: <strong id="char-money">500 $</strong></span>
        <span>NETTO: <strong id="char-networth">500 $</strong></span>
    </div>

    <div class="log-box" id="log-box"></div>

    <div class="nav-bar">
        <button class="nav-item" onclick="openView('job')">
            <div class="nav-icon">💼</div>
            Karriere
        </button>
        <button class="nav-item" onclick="openView('assets')">
            <div class="nav-icon">🏠</div>
            Besitz
        </button>
        
        <div class="age-btn-wrapper">
            <button class="age-btn" onclick="ageUp()">
                <span class="plus-icon">+</span>
                <span class="age-text">AGE</span>
            </button>
        </div>

        <button class="nav-item" onclick="openView('relationships')">
            <div class="nav-icon">❤️</div>
            Kontakte
        </button>
        <button class="nav-item" onclick="openView('activities')">
            <div class="nav-icon">🎬</div>
            Aktivitäten
        </button>
    </div>

    <div class="stats-section">
        <div class="stat-row">
            <span class="stat-label">Glück</span>
            <div class="stat-bar-bg"><div id="bar-happy" class="stat-bar-fill fill-happy"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Gesundheit</span>
            <div class="stat-bar-bg"><div id="bar-health" class="stat-bar-fill fill-health"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Smartness</span>
            <div class="stat-bar-bg"><div id="bar-smart" class="stat-bar-fill fill-smart"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Aussehen</span>
            <div class="stat-bar-bg"><div id="bar-looks" class="stat-bar-fill fill-looks"></div></div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="bitlife-modal" class="bitlife-modal">
        <div class="bitlife-header">
            <button class="bitlife-close-btn" onclick="closeView()">✕</button>
            <h2 id="bitlife-title">MENÜ</h2>
            <div style="width:30px;"></div>
        </div>
        <div class="bitlife-menu-list" id="bitlife-content"></div>
    </div>

    <div id="choice-overlay" class="choice-overlay">
        <div class="choice-card">
            <div id="choice-icon" class="choice-icon">❓</div>
            <div id="choice-title" class="choice-title">ENTSCHEIDUNG</div>
            <div id="choice-desc" class="choice-desc">Was möchtest du tun?</div>
            <div id="choice-options"></div>
        </div>
    </div>

    <div id="death-screen" class="death-screen">
        <div class="tombstone">
            <div style="font-size:38px; margin-bottom:10px;">🪦</div>
            <h2>R.I.P.</h2>
            <p id="death-name">Henri Daher</p>
            <p id="death-years" style="font-weight:bold; color:white; margin-top:10px;">14 - 82 Jahre</p>
            <p id="death-cause" style="font-size:12px; margin-top:15px;"></p>
        </div>
        <button onclick="location.reload()" class="choice-option-btn success" style="max-width:240px;">Neues Leben beginnen</button>
    </div>
</div>

<script>
    // --- GLOBAL PLAYER STATE ---
    let p = {
        name: "Henri Daher",
        age: 14,
        money: 500,
        debt: 0,
        status: "Schüler",
        schoolGrade: 85,
        education: "Gymnasium",
        degree: null,
        hasDriverLicense: false,
        job: "Arbeitslos",
        jobPerformance: 50,
        salary: 0,
        happy: 85,
        health: 90,
        smart: 80,
        looks: 75,
        alive: true,
        inJail: false,
        jailYears: 0,
        addicted: false,
        addictionType: null,
        diseases: [],
        partner: null, // { name, rel, age, married: false, ring: null, prenup: false }
        children: [],
        houses: [], // { type, price, upkeep, condition, haunted }
        cars: [], // { brand, price, condition }
        pets: [],
        jewelry: [],
        willBeneficiary: "Alle Kinder gleich",
        relationships: [
            { id: 1, name: "Yamila Daher", role: "Mutter", age: 42, rel: 90 },
            { id: 2, name: "Aladdin Antoun", role: "Stiefvater", age: 45, rel: 65 },
            { id: 3, name: "Saladin Antoun", role: "Halb-Bruder", age: 10, rel: 60 },
            { id: 4, name: "Adham Baba", role: "Bester Freund", age: 14, rel: 85 }
        ],
        schoolClassmates: [
            { id: 101, name: "Leon Müller", rel: 50 },
            { id: 102, name: "Mia Schneider", rel: 55 },
            { id: 103, name: "Tim Weber", rel: 40 }
        ],
        colleagues: []
    };

    let nextRelId = 200;

    const jobsList = [
        { title: "Fast-Food-Mitarbeiter/in", salary: 18000, reqSmart: 10, reqDegree: null },
        { title: "Büroassistent/in", salary: 35000, reqSmart: 35, reqDegree: null },
        { title: "Militär-Soldat/in", salary: 44000, reqSmart: 30, reqDegree: null },
        { title: "Junior Software-Entwickler/in", salary: 72000, reqSmart: 68, reqDegree: "Informatik" },
        { title: "Anwalt / Anwältin", salary: 120000, reqSmart: 80, reqDegree: "Jura" },
        { title: "Arzt / Ärztin", salary: 155000, reqSmart: 85, reqDegree: "Medizin" },
        { title: "Manager / Director", salary: 210000, reqSmart: 88, reqDegree: "BWL" }
    ];

    const houseShopList = [
        { type: "Eigentumswohnung", price: 110000, upkeep: 1200, haunted: false },
        { type: "Einfamilienhaus", price: 350000, upkeep: 3800, haunted: false },
        { type: "👻 Spukvilla", price: 190000, upkeep: 2200, haunted: true },
        { type: "Luxusvilla mit Pool", price: 1250000, upkeep: 14000, haunted: false }
    ];

    const carShopList = [
        { brand: "Gebrauchter Kleinwagen", price: 4500 },
        { brand: "Elektro-Limousine", price: 48000 },
        { brand: "Sportwagen V8", price: 92000 },
        { brand: "Hypercar", price: 350000 }
    ];

    const petShopList = [
        { name: "Mops", type: "Hund", price: 650, icon: "🐶" },
        { name: "Perserkatze", type: "Katze", price: 500, icon: "🐱" },
        { name: "Schäferhund", type: "Hund", price: 1300, icon: "🐕" },
        { name: "Papagei", type: "Vogel", price: 800, icon: "🦜" }
    ];

    const ringShopList = [
        { name: "Silberring", price: 300 },
        { name: "Goldring mit Saphir", price: 2500 },
        { name: "Platin-Diamantring", price: 15000 },
        { name: "Selterner 5-Karat-Diamant", price: 50000 }
    ];

    // --- HELPER FUNCTIONS ---
    function calculateNetWorth() {
        let houseVal = p.houses.reduce((acc, h) => acc + h.price, 0);
        let carVal = p.cars.reduce((acc, c) => acc + c.price, 0);
        return (p.money - p.debt) + houseVal + carVal;
    }

    function updateUI() {
        document.getElementById('char-name').innerText = p.name;
        document.getElementById('char-age').innerText = p.age;
        document.getElementById('char-money').innerText = p.money.toLocaleString() + " $";
        document.getElementById('char-networth').innerText = calculateNetWorth().toLocaleString() + " $";
        
        let jobText = p.status;
        if (p.inJail) jobText = "🔒 Im Gefängnis";
        else if (p.job !== "Arbeitslos") jobText = p.job;
        document.getElementById('char-job').innerText = jobText;

        document.getElementById('bar-happy').style.width = p.happy + "%";
        document.getElementById('bar-health').style.width = p.health + "%";
        document.getElementById('bar-smart').style.width = p.smart + "%";
        document.getElementById('bar-looks').style.width = p.looks + "%";
    }

    function addLog(text, type = "normal") {
        const box = document.getElementById('log-box');
        let cssClass = "log-entry " + type;
        box.innerHTML = `<div class="${cssClass}"><strong>Alter ${p.age}:</strong> ${text}</div>` + box.innerHTML;
    }

    function clampStats() {
        p.happy = Math.max(0, Math.min(100, p.happy));
        p.health = Math.max(0, Math.min(100, p.health));
        p.smart = Math.max(0, Math.min(100, p.smart));
        p.looks = Math.max(0, Math.min(100, p.looks));

        if (p.health <= 0 && p.alive) {
            killCharacter("Schwere Krankheit / Gesundheitsschaden");
        }
    }

    function killCharacter(cause) {
        p.alive = false;
        document.getElementById('death-name').innerText = p.name;
        document.getElementById('death-years').innerText = `14 - ${p.age} Jahre`;
        document.getElementById('death-cause').innerText = `Todesursache: ${cause}\nGesamtvermögen: ${calculateNetWorth().toLocaleString()} $`;
        document.getElementById('death-screen').style.display = 'flex';
    }

    // --- MAIN AGE UP SYSTEM ---
    function ageUp() {
        if (!p.alive) return;
        p.age++;
        p.relationships.forEach(r => r.age++);
        p.children.forEach(c => c.age++);
        if (p.partner) p.partner.age++;

        // Schulabschluss mit 18
        if (p.age === 18 && p.status === "Schüler") {
            p.status = "Arbeitslos";
            addLog("🎓 Du hast die Schule erfolgreich abgeschlossen!", "good");
        }

        // Alterstod
        if (p.age > 72 && Math.random() < (p.age - 70) * 0.06) {
            killCharacter("Altersschwäche");
            return;
        }

        // Gefängnis-Check
        if (p.inJail) {
            p.jailYears--;
            if (p.jailYears <= 0) {
                p.inJail = false;
                addLog("🔓 Du hast deine Haftstrafe abgesessen und bist wieder frei!", "good");
            } else {
                addLog(`🔒 Noch ${p.jailYears} Jahre im Gefängnis abzusitzen.`, "bad");
            }
            clampStats(); updateUI(); return;
        }

        // Schulden & Zinsen
        if (p.debt > 0) {
            let interest = Math.floor(p.debt * 0.05);
            p.debt += interest;
            addLog(`📉 Kreditzinsen: +${interest.toLocaleString()} $ Schulden.`, "bad");
        }

        // Einkommen & Häuser-Instandhaltung
        if (p.salary > 0) p.money += p.salary;
        p.houses.forEach(h => {
            if (p.money >= h.upkeep) {
                p.money -= h.upkeep;
            } else {
                p.happy -= 5;
                addLog(`Kosten für ${h.type} konnten nicht gedeckt werden!`, "bad");
            }
        });

        // Auto-Wertverlust & Defekte
        p.cars.forEach(c => {
            c.price = Math.floor(c.price * 0.90); // 10% Wertverlust
            if (Math.random() < 0.2) {
                let repairCost = Math.floor(c.price * 0.08);
                if (p.money >= repairCost) {
                    p.money -= repairCost;
                    addLog(`🔧 Reparatur für deinen ${c.brand}: -${repairCost} $`, "bad");
                }
            }
        });

        // Sucht-Auswirkungen
        if (p.addicted) {
            p.health -= 8;
            p.happy -= 5;
            addLog(`⚠️ Deine ${p.addictionType}-Sucht verschlechtert deine Gesundheit.`, "bad");
        }

        // Zufallskrankheiten
        if (Math.random() < 0.14 && p.diseases.length === 0) {
            let krankheiten = ["Grippe", "Depressionen", "Bluthochdruck", "Schlaflosigkeit", "Gicht"];
            let d = krankheiten[Math.floor(Math.random() * krankheiten.length)];
            p.diseases.push(d);
            p.health -= 15; p.happy -= 12;
            addLog(`🤒 Du bist an ${d} erkrankt!`, "bad");
        }

        // Spukhaus Event
        if (p.houses.some(h => h.haunted) && Math.random() < 0.30) {
            addLog("👻 Ein böser Geist spukt in deiner Villa!", "ghost");
            p.happy -= 12;
        }

        // Random Life Events
        triggerRandomEvent();

        addLog("Ein weiteres Lebensjahr ist vergangen.");
        clampStats(); updateUI();
    }

    function triggerRandomEvent() {
        let rand = Math.random();
        if (rand < 0.08 && p.age >= 16) {
            triggerChoice("🎉 Wild Party", "Ein Freund lädt dich auf eine wilde Party ein. Es werden Substanzen angeboten.", [
                { text: "Exzessiv feiern", action: () => {
                    if (Math.random() < 0.35) {
                        p.addicted = true; p.addictionType = "Alkohol";
                        addLog("⚠️ Du bist alkoholabhängig geworden!", "bad");
                    } else {
                        p.happy += 20; addLog("Party war legendär!", "good");
                    }
                }},
                { text: "Ablehnen", action: () => { addLog("Du bist zuhause geblieben."); }, style: "secondary" }
            ]);
        }
    }

    // --- OVERLAY & CHOICES ---
    function triggerChoice(title, desc, options, icon = "⚡") {
        document.getElementById('choice-icon').innerText = icon;
        document.getElementById('choice-title').innerText = title;
        document.getElementById('choice-desc').innerText = desc;
        const container = document.getElementById('choice-options');
        container.innerHTML = "";

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = `choice-option-btn ${opt.style || ''}`;
            btn.innerText = opt.text;
            btn.onclick = () => {
                document.getElementById('choice-overlay').style.display = 'none';
                opt.action();
                clampStats(); updateUI();
            };
            container.appendChild(btn);
        });

        document.getElementById('choice-overlay').style.display = 'flex';
    }

    function closeView() { document.getElementById('bitlife-modal').style.display = 'none'; }

    // --- MAIN VIEWS ---
    function openView(type) {
        if (!p.alive) return;
        const modal = document.getElementById('bitlife-modal');
        const title = document.getElementById('bitlife-title');
        const content = document.getElementById('bitlife-content');

        if (p.inJail) {
            title.innerText = "GEFÄNGNIS";
            content.innerHTML = `
                <div class="bitlife-divider">Knast-Aktionen</div>
                ${createActItem('🏃', 'Ausbruch versuchen', 'Versuche zu entkommen', 'tryPrisonEscape()')}

    function bribeGuard() {
        closeView();
        if (p.money < 5000) { alert("Kosten: 5.000 $"); return; }
        p.money -= 5000;
        if (Math.random() < 0.5) {
            p.inJail = false; p.jailYears = 0;
            addLog("💵 Wärter erfolgreich bestochen! Du bist frei.", "good");
        } else {
            addLog("❌ Der Wärter hat das Geld genommen, lässt dich aber nicht frei!", "bad");
        }
        updateUI();
    }

    function interactChild(id) {
        let child = p.children.find(c => c.id === id);
        closeView();
        triggerChoice(child.name, `Aktion mit Kind ${child.name}:`, [
            { text: "Zeit verbringen", action: () => { child.rel = Math.min(100, child.rel + 15); p.happy += 5; addLog(`Zeit verbracht mit ${child.name}.`); }},
            { text: "Taschengeld geben (100 $)", action: () => {
                if (p.money >= 100) { p.money -= 100; child.rel = Math.min(100, child.rel + 20); addLog(`Taschengeld gegeben.`); }
            }}
        ]);
    }

    function interactRel(id) {
        let r = p.relationships.find(x => x.id === id);
        closeView();
        triggerChoice(r.name, `Aktion mit ${r.name}:`, [
            { text: "Zeit verbringen", action: () => { r.rel = Math.min(100, r.rel + 10); p.happy += 5; addLog(`Zeit verbracht mit ${r.name}.`); }},
            { text: "Kompliment machen", action: () => { r.rel = Math.min(100, r.rel + 15); addLog(`${r.name} hat sich gefreut.`); }}
        ]);
    }

    function openPetShop() {
        const content = document.getElementById('bitlife-content');
        content.innerHTML = `<div class="bitlife-divider">Tierheim</div>`;
        petShopList.forEach((pet, i) => {
            content.innerHTML += createActItem(pet.icon, pet.name, `${pet.price} $`, `buyPet(${i})`);
        });
    }

    function buyPet(i) {
        let pet = petShopList[i];
        if (p.money >= pet.price) {
            p.money -= pet.price; p.pets.push(pet); p.happy += 20;
            addLog(`${pet.icon} Du hast einen ${pet.name} adoptiert!`, "good");
        } else alert("Nicht genug Geld!");
        closeView(); updateUI();
    }

    function doGym() { p.health = Math.min(100, p.health + 5); p.looks = Math.min(100, p.looks + 3); addLog("🏋️ Im Gym trainiert."); closeView(); updateUI(); }

    addLog("Du bist als Henri Daher geboren.");
    updateUI();
</script>

</body>
</html>
