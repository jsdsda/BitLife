<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BitLife - Life Simulator Ultimate</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #030712;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 460px;
            height: 100vh;
            max-height: 960px;
            background-color: #0b1528;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 80px rgba(0,0,0,0.95);
            position: relative;
            overflow: hidden;
        }

        /* BITLIFE TOPBAND */
        .bitlife-topband {
            background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
            color: #000000;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 4px solid #854d0e;
        }
        .bitlife-topband h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }
        .bitlife-topband .subtitle {
            font-size: 12px;
            font-weight: 800;
            margin-top: 3px;
            color: #1e293b;
            text-transform: uppercase;
        }
        .bitlife-finance-bar {
            background-color: #0f172a;
            color: #ffffff;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            font-weight: 800;
            border-bottom: 2px solid #1e293b;
        }

        /* LOG BOX */
        .log-box {
            flex-grow: 1;
            padding: 14px;
            overflow-y: auto;
            background: #030712;
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
        }
        .log-entry {
            background: #0f172a;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 13.5px;
            line-height: 1.5;
            border-left: 6px solid #facc15;
            color: #f1f5f9;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .log-entry.good { border-left-color: #22c55e; }
        .log-entry.bad { border-left-color: #ef4444; }
        .log-entry.love { border-left-color: #ec4899; }
        .log-entry.crime { border-left-color: #a855f7; }
        .log-entry.ghost { border-left-color: #06b6d4; }
        .log-entry.business { border-left-color: #f59e0b; }
        .log-entry.crypto { border-left-color: #8b5cf6; }

        /* NAV BAR */
        .nav-bar {
            display: flex;
            background-color: #0f172a;
            height: 76px;
            align-items: center;
            position: relative;
            border-top: 2px solid #1e293b;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 9.5px;
            font-weight: 800;
            background: none;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }
        .nav-icon { font-size: 22px; margin-bottom: 3px; }
        
        .age-btn-wrapper {
            position: relative;
            z-index: 50;
            margin-top: -34px;
        }
        .age-btn {
            width: 88px;
            height: 88px;
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            border: 4px solid #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 900;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            cursor: pointer;
            transition: transform 0.08s ease;
        }
        .age-btn:active { transform: scale(0.92); }
        .age-btn .plus-icon { font-size: 28px; line-height: 1; font-weight: 900; }
        .age-btn .age-text { font-size: 11.5px; letter-spacing: 0.5px; }

        /* STATS BARS */
        .stats-section {
            background-color: #030712;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            border-top: 1px solid #1e293b;
        }
        .stat-row { display: flex; align-items: center; }
        .stat-label { width: 100px; font-size: 11px; font-weight: 900; color: #94a3b8; text-transform: uppercase; }
        .stat-bar-bg {
            flex-grow: 1;
            height: 12px;
            background-color: #1e293b;
            border-radius: 6px;
            overflow: hidden;
        }
        .stat-bar-fill { height: 100%; transition: width 0.3s ease; }
        .fill-happy { background: #eab308; }
        .fill-health { background: #22c55e; }
        .fill-smart { background: #3b82f6; }
        .fill-looks { background: #ec4899; }
        .fill-fame { background: #a855f7; }

        /* MODALS & OVERLAYS */
        .bitlife-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff;
            color: #000000;
            z-index: 200;
            flex-direction: column;
        }
        .bitlife-header {
            background: #0f172a;
            color: white;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .bitlife-header h2 {
            margin: 0; font-size: 17px; font-weight: 900; text-transform: uppercase;
        }
        .bitlife-close-btn {
            background: rgba(255,255,255,0.2); border: none; color: white;
            width: 32px; height: 32px; border-radius: 50%; font-weight: bold; cursor: pointer;
        }
        .bitlife-menu-list { flex-grow: 1; overflow-y: auto; background: #f8fafc; }

        .bitlife-item {
            display: flex; align-items: center; padding: 14px 18px;
            border-bottom: 1px solid #e2e8f0; cursor: pointer; background: #ffffff;
        }
        .bitlife-item:active { background: #f1f5f9; }
        .bitlife-item-icon { font-size: 24px; margin-right: 14px; width: 32px; text-align: center; }
        .bitlife-item-text { flex-grow: 1; }
        .bitlife-item-title { font-weight: 800; font-size: 14px; color: #0f172a; }
        .bitlife-item-sub { font-size: 12px; color: #64748b; margin-top: 2px; }
        .bitlife-item-arrow { color: #0f172a; font-weight: bold; font-size: 14px; }

        .bitlife-divider {
            background: #334155; color: white; padding: 7px 18px;
            font-size: 10.5px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .choice-overlay {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.92); z-index: 300;
            justify-content: center; align-items: center; padding: 22px;
        }
        .choice-card {
            background: #ffffff; color: #000000; width: 100%;
            border-radius: 16px; padding: 24px; text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
        }
        .choice-icon { font-size: 48px; margin-bottom: 10px; }
        .choice-title { font-size: 19px; font-weight: 900; color: #0f172a; margin-bottom: 8px; }
        .choice-desc { font-size: 13.5px; color: #334155; margin-bottom: 20px; line-height: 1.5; }
        .choice-option-btn {
            width: 100%; padding: 13px; margin-bottom: 10px;
            background: #0f172a; color: white; border: none;
            border-radius: 8px; font-weight: 800; font-size: 13.5px; cursor: pointer;
        }
        .choice-option-btn:last-child { margin-bottom: 0; }
        .choice-option-btn.danger { background: #ef4444; }
        .choice-option-btn.secondary { background: #64748b; }
        .choice-option-btn.success { background: #22c55e; }

        .death-screen {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #030712; color: white; z-index: 500;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center;
        }
        .tombstone {
            background: #1e293b; border: 4px solid #475569;
            border-top-left-radius: 120px; border-top-right-radius: 120px;
            width: 270px; padding: 50px 20px 30px 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.95); margin-bottom: 30px;
        }
        .tombstone h2 { margin: 0; font-size: 28px; font-weight: 900; color: #f8fafc; }
        .tombstone p { margin: 8px 0; font-size: 14px; color: #cbd5e1; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="bitlife-topband">
        <h1 id="char-name">Henri Daher</h1>
        <div class="subtitle" id="char-job">Schüler</div>
    </div>
    <div class="bitlife-finance-bar">
        <span>ALTER: <strong id="char-age">14</strong></span>
        <span>BANK: <strong id="char-money">500 $</strong></span>
        <span>NETTO: <strong id="char-networth">500 $</strong></span>
    </div>

    <div class="log-box" id="log-box"></div>

    <div class="nav-bar">
        <button class="nav-item" onclick="openView('job')">
            <div class="nav-icon">💼</div>
            Karriere
        </button>
        <button class="nav-item" onclick="openView('assets')">
            <div class="nav-icon">🏠</div>
            Besitz
        </button>
        
        <div class="age-btn-wrapper">
            <button class="age-btn" onclick="ageUp()">
                <span class="plus-icon">+</span>
                <span class="age-text">AGE</span>
            </button>
        </div>

        <button class="nav-item" onclick="openView('relationships')">
            <div class="nav-icon">❤️</div>
            Kontakte
        </button>
        <button class="nav-item" onclick="openView('activities')">
            <div class="nav-icon">🎬</div>
            Aktivitäten
        </button>
    </div>

    <div class="stats-section">
        <div class="stat-row">
            <span class="stat-label">Glück</span>
            <div class="stat-bar-bg"><div id="bar-happy" class="stat-bar-fill fill-happy"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Gesundheit</span>
            <div class="stat-bar-bg"><div id="bar-health" class="stat-bar-fill fill-health"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Smartness</span>
            <div class="stat-bar-bg"><div id="bar-smart" class="stat-bar-fill fill-smart"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Aussehen</span>
            <div class="stat-bar-bg"><div id="bar-looks" class="stat-bar-fill fill-looks"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Ruhm / Fame</span>
            <div class="stat-bar-bg"><div id="bar-fame" class="stat-bar-fill fill-fame"></div></div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="bitlife-modal" class="bitlife-modal">
        <div class="bitlife-header">
            <button class="bitlife-close-btn" onclick="closeView()">✕</button>
            <h2 id="bitlife-title">MENÜ</h2>
            <div style="width:32px;"></div>
        </div>
        <div class="bitlife-menu-list" id="bitlife-content"></div>
    </div>

    <div id="choice-overlay" class="choice-overlay">
        <div class="choice-card">
            <div id="choice-icon" class="choice-icon">❓</div>
            <div id="choice-title" class="choice-title">ENTSCHEIDUNG</div>
            <div id="choice-desc" class="choice-desc">Was möchtest du tun?</div>
            <div id="choice-options"></div>
        </div>
    </div>

    <div id="death-screen" class="death-screen">
        <div class="tombstone">
            <div style="font-size:42px; margin-bottom:12px;">🪦</div>
            <h2>R.I.P.</h2>
            <p id="death-name">Henri Daher</p>
            <p id="death-years" style="font-weight:bold; color:white; margin-top:12px;">14 - 82 Jahre</p>
            <p id="death-cause" style="font-size:12.5px; margin-top:16px;"></p>
        </div>
        <button onclick="location.reload()" class="choice-option-btn success" style="max-width:250px;">Neues Leben beginnen</button>
    </div>
</div>

<script>
    // --- GLOBAL PLAYER STATE ---
    let p = {
        name: "Henri Daher",
        age: 14,
        money: 500,
        debt: 0,
        status: "Schüler",
        schoolGrade: 85,
        education: "Gymnasium",
        degree: null,
        hasDriverLicense: false,
        job: "Arbeitslos",
        jobPerformance: 50,
        salary: 0,
        yearsInJob: 0,
        happy: 85,
        health: 90,
        smart: 80,
        looks: 75,
        fame: 0,
        socialFollowers: 0,
        alive: true,
        inJail: false,
        jailYears: 0,
        addicted: false,
        addictionType: null,
        diseases: [],
        partner: null,
        children: [],
        houses: [],
        cars: [],
        pets: [],
        jewelry: [],
        
        // BUSINESS EMPIRE
        company: null,
        
        // STOCKS & CRYPTO PORTFOLIO
        portfolio: {
            bitcoin: { shares: 0, price: 42000 },
            ethereum: { shares: 0, price: 2800 },
            techCorp: { shares: 0, price: 180 },
            energyGlobal: { shares: 0, price: 95 },
            realEstateTrust: { shares: 0, price: 310 },
            goldReserve: { shares: 0, price: 2100 }
        },
        
        // MAFIA & CRIME
        mafiaRank: "Zivilist", // "Handlanger", "Soldat", "Capo", "Underboss", "Godfather"
        mafiaSyndicate: null,
        criminalRecord: [],

        // RELATIONS
        relationships: [
            { id: 1, name: "Yamila Daher", role: "Mutter", age: 42, rel: 90 },
            { id: 2, name: "Aladdin Antoun", role: "Stiefvater", age: 45, rel: 65 },
            { id: 3, name: "Saladin Antoun", role: "Halb-Bruder", age: 10, rel: 60 },
            { id: 4, name: "Adham Baba", role: "Bester Freund", age: 14, rel: 85 }
        ]
    };

    let nextRelId = 500;

    // --- DATA TABLES ---
    const jobsList = [
        { title: "Fast-Food-Mitarbeiter/in", salary: 18000, reqSmart: 10, reqDegree: null },
        { title: "Büroassistent/in", salary: 34000, reqSmart: 30, reqDegree: null },
        { title: "Junior Software-Entwickler/in", salary: 72000, reqSmart: 65, reqDegree: "Informatik" },
        { title: "Senior Software Engineer", salary: 125000, reqSmart: 75, reqDegree: "Informatik" },
        { title: "Anwalt / Anwältin", salary: 110000, reqSmart: 80, reqDegree: "Jura" },
        { title: "Assistenzarzt / Ärztin", salary: 98000, reqSmart: 85, reqDegree: "Medizin" },
        { title: "Chefarzt / Chefärztin", salary: 210000, reqSmart: 90, reqDegree: "Medizin" },
        { title: "Investmentbanker", salary: 140000, reqSmart: 85, reqDegree: "BWL" },
        { title: "Unternehmensberater", salary: 95000, reqSmart: 75, reqDegree: "BWL" },
        { title: "Bauingenieur/in", salary: 68000, reqSmart: 65, reqDegree: "Ingenieurwesen" },
        { title: "Grafikdesigner/in", salary: 42000, reqSmart: 40, reqDegree: "Kunst" }
    ];

    const houseShopList = [
        { type: "Kleine Eigentumswohnung", price: 120000, upkeep: 1400, haunted: false },
        { type: "Modernes Reihenhaus", price: 290000, upkeep: 3100, haunted: false },
        { type: "Einfamilienhaus mit Garten", price: 480000, upkeep: 5200, haunted: false },
        { type: "👻 Alte Spukvilla", price: 220000, upkeep: 2800, haunted: true },
        { type: "Luxusvilla mit Infinity-Pool", price: 1850000, upkeep: 18000, haunted: false },
        { type: "Penthousedachwohnung", price: 2400000, upkeep: 22000, haunted: false }
    ];

    const carShopList = [
        { brand: "Gebrauchter Kleinwagen", price: 4200 },
        { brand: "Familien-Kombi", price: 28000 },
        { brand: "Elektro-Limousine", price: 54000 },
        { brand: "Luxus SUV", price: 88000 },
        { brand: "Sportwagen V8", price: 135000 },
        { brand: "Hypercar V12", price: 450000 }
    ];

    // --- HELPER FUNCTIONS ---
    function calculateNetWorth() {
        let houseVal = p.houses.reduce((acc, h) => acc + h.price, 0);
        let carVal = p.cars.reduce((acc, c) => acc + c.price, 0);
        
        let stockVal = 0;
        for (let key in p.portfolio) {
            stockVal += p.portfolio[key].shares * p.portfolio[key].price;
        }

        let compVal = p.company ? p.company.valuation : 0;
        return (p.money - p.debt) + houseVal + carVal + stockVal + compVal;
    }

    function updateUI() {
        document.getElementById('char-name').innerText = p.name;
        document.getElementById('char-age').innerText = p.age;
        document.getElementById('char-money').innerText = p.money.toLocaleString() + " $";
        document.getElementById('char-networth').innerText = calculateNetWorth().toLocaleString() + " $";
        
        let jobText = p.status;
        if (p.inJail) jobText = "🔒 Im Gefängnis";
        else if (p.company) jobText = `👔 Gründer von ${p.company.name}`;
        else if (p.mafiaRank !== "Zivilist") jobText = `🗡️ Mafia: ${p.mafiaRank}`;
        else if (p.job !== "Arbeitslos") jobText = p.job;
        document.getElementById('char-job').innerText = jobText;

        document.getElementById('bar-happy').style.width = p.happy + "%";
        document.getElementById('bar-health').style.width = p.health + "%";
        document.getElementById('bar-smart').style.width = p.smart + "%";
        document.getElementById('bar-looks').style.width = p.looks + "%";
        document.getElementById('bar-fame').style.width = p.fame + "%";
    }

    function addLog(text, type = "normal") {
        const box = document.getElementById('log-box');
        let cssClass = "log-entry " + type;
        box.innerHTML = `<div class="${cssClass}"><strong>Alter ${p.age}:</strong> ${text}</div>` + box.innerHTML;
    }

    function clampStats() {
        p.happy = Math.max(0, Math.min(100, p.happy));
        p.health = Math.max(0, Math.min(100, p.health));
        p.smart = Math.max(0, Math.min(100, p.smart));
        p.looks = Math.max(0, Math.min(100, p.looks));
        p.fame = Math.max(0, Math.min(100, p.fame));

        if (p.health <= 0 && p.alive) {
            killCharacter("Gesundheitlicher Kollaps & Herzversagen");
        }
    }

    function killCharacter(cause) {
        p.alive = false;
        document.getElementById('death-name').innerText = p.name;
        document.getElementById('death-years').innerText = `14 - ${p.age} Jahre`;
        document.getElementById('death-cause').innerText = `Todesursache: ${cause}\nGesamtvermögen: ${calculateNetWorth().toLocaleString()} $`;
        document.getElementById('death-screen').style.display = 'flex';
    }

    function triggerChoice(title, desc, options, icon = "⚡") {
        document.getElementById('choice-icon').innerText = icon;
        document.getElementById('choice-title').innerText = title;
        document.getElementById('choice-desc').innerText = desc;
        const container = document.getElementById('choice-options');
        container.innerHTML = "";

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = `choice-option-btn ${opt.style || ''}`;
            btn.innerText = opt.text;
            btn.onclick = () => {
                document.getElementById('choice-overlay').style.display = 'none';
                opt.action();
                clampStats(); updateUI();
            };
            container.appendChild(btn);
        });

        document.getElementById('choice-overlay').style.display = 'flex';
    }

    function closeView() { document.getElementById('bitlife-modal').style.display = 'none'; }

    // --- MAIN AGE UP SIMULATION ---
    function ageUp() {
        if (!p.alive) return;
        p.age++;
        p.relationships.forEach(r => r.age++);
        p.children.forEach(c => c.age++);
        if (p.partner) p.partner.age++;

        // Schulabschluss
        if (p.age === 18 && p.status === "Schüler") {
            p.status = "Arbeitslos";
            addLog("🎓 Du hast das Gymnasium erfolgreich abgeschlossen!", "good");
        }

        // Alterstod Check
        if (p.age > 75 && Math.random() < (p.age - 72) * 0.05) {
            killCharacter("Altersschwäche");
            return;
        }

        // Gefängnis Simulation
        if (p.inJail) {
            p.jailYears--;
            if (p.jailYears <= 0) {
                p.inJail = false;
                addLog("🔓 Du hast deine Haftstrafe vollständig abgesessen!", "good");
            } else {
                addLog(`🔒 Noch ${p.jailYears} Jahre im Gefängnis zu verbleiben.`, "bad");
            }
            clampStats(); updateUI(); return;
        }

        // 📈 BÖRSE & CRYPTO SIMULATION
        simulateMarkets();

        // 🏢 FIRMEN-SIMULATION
        if (p.company) {
            simulateCompanyYear();
        }

        // 💰 ZINSEN & SCHULDEN
        if (p.debt > 0) {
            let interest = Math.floor(p.debt * 0.06);
            p.debt += interest;
            addLog(`📉 Zinsen auf Schulden: +${interest.toLocaleString()} $`, "bad");
        }

        // GEHALT & IMMOBILIEN
        if (p.salary > 0) {
            p.money += p.salary;
            p.yearsInJob++;
            
            // Beförderungs-Chance
            if (p.jobPerformance > 80 && Math.random() < 0.25) {
                let raise = Math.floor(p.salary * 0.12);
                p.salary += raise;
                addLog(`🎉 Beförderung & Gehaltserhöhung! Dein neues Gehalt: ${p.salary.toLocaleString()} $`, "good");
            }
        }

        p.houses.forEach(h => {
            if (p.money >= h.upkeep) {
                p.money -= h.upkeep;
            } else {
                p.happy -= 8;
                addLog(`Instandhaltungskosten für ${h.type} konnten nicht gezahlt werden!`, "bad");
            }
        });

        // SOCIAL MEDIA SCHWUND
        if (p.socialFollowers > 0) {
            p.socialFollowers = Math.floor(p.socialFollowers * 0.94);
        }

        // 🎲 BITLIFE RANDOM EVENTS TRIGGER
        triggerRandomAgeEvent();

        addLog("Ein weiteres Lebensjahr ist vergangen.");
        clampStats(); updateUI();
    }

    // --- MARKET SIMULATION ---
    function simulateMarkets() {
        let btcChange = (Math.random() - 0.47) * 0.45;
        p.portfolio.bitcoin.price = Math.max(200, Math.floor(p.portfolio.bitcoin.price * (1 + btcChange)));

        let ethChange = (Math.random() - 0.46) * 0.35;
        p.portfolio.ethereum.price = Math.max(50, Math.floor(p.portfolio.ethereum.price * (1 + ethChange)));

        let techChange = (Math.random() - 0.45) * 0.18;
        p.portfolio.techCorp.price = Math.max(15, Math.floor(p.portfolio.techCorp.price * (1 + techChange)));

        if (btcChange > 0.3) addLog("🚀 Bitcoin erlebt eine historische Explosion!", "crypto");
        if (btcChange < -0.3) addLog("💥 Riesen-Crash auf dem Kryptomarkt!", "bad");
    }

    // --- FIRMEN SIMULATION ---
    function simulateCompanyYear() {
        let c = p.company;
        let marketFactor = Math.random() * 0.5 - 0.12;
        let netRevenue = Math.floor(c.revenue * marketFactor);

        c.valuation = Math.max(10000, Math.floor(c.valuation + netRevenue * 1.8));
        
        if (netRevenue > 0) {
            p.money += netRevenue;
            addLog(`🏢 ${c.name} erwirtschaftet ${netRevenue.toLocaleString()} $ Jahresgewinn!`, "business");
        } else {
            addLog(`📉 ${c.name} hatte ein Verlustjahr (${netRevenue.toLocaleString()} $).`, "bad");
        }
    }

    // --- BITLIFE RANDOM EVENTS ---
    function triggerRandomAgeEvent() {
        let rand = Math.random();

        if (rand < 0.08) {
            triggerChoice(" Schulhof-Mobbing", "Ein Mitschüler macht sich öffentlich über deine Kleidung lustig. Wie reagierst du?", [
                { text: "Ihn ignorieren", action: () => { p.happy -= 5; addLog("Du hast das Mobbing ignoriert."); } },
                { text: "Verbal zurückschlagen", action: () => { p.smart += 2; addLog("Du hast ihn vor allen lächerlich gemacht!", "good"); } },
                { text: "Ihm eine Tracht Prügel verpassen", action: () => { 
                    if (Math.random() < 0.6) { p.happy += 10; addLog("Du hast den Mobber zusammengeschlagen!", "crime"); }
                    else { p.health -= 20; addLog("Du hast die Schlägerei verloren.", "bad"); }
                }, style: "danger" }
            ], "🏫");
        } 
        else if (rand < 0.14) {
            triggerChoice("💰 Erbschaft von Onkel", "Ein weit entfernter Onkel ist verstorben und hinterlässt dir Geld!", [
                { text: "Erbe annehmen (+15.000 $)", action: () => { p.money += 15000; addLog("💰 15.000 $ Erbschaft erhalten!", "good"); } }
            ], "🎁");
        }
        else if (rand < 0.20) {
            triggerChoice("😷 Unerwartete Krankheit", "Du wachst mit starkem Fieber und Schüttelfrost auf.", [
                { text: "Ins Bett legen", action: () => { p.health -= 10; addLog("Krankheit durchgestanden."); } },
                { text: "Sofort zum Arzt gehen (150 $)", action: () => { 
                    if (p.money >= 150) { p.money -= 150; p.health += 10; addLog("Arzt hat dir erfolgreich Medikamente verschrieben.", "good"); }
                }}
            ], "🤒");
        }
        else if (rand < 0.25) {
            triggerChoice("🐕 Streunender Hund", "Ein herrenloser Hund läuft dir auf der Straße hinterher und wedelt mit dem Schwanz.", [
                { text: "Mit nach Hause nehmen", action: () => { p.happy += 15; addLog("Du hast einen treuen Hund adoptiert! 🐶", "good"); } },
                { text: "Weitergehen", action: () => {} }
            ], "🐕");
        }
        else if (rand < 0.30 && p.age >= 18) {
            triggerChoice("🚗 Beinahe-Unfall", "Ein Raser überholt dich gefährlich nah im Straßenverkehr!", [
                { text: "Ruhig bleiben", action: () => { p.happy -= 2; } },
                { text: "Hupen und Mittelfinger zeigen", action: () => { p.happy += 5; addLog("Du hast deinem Ärger Luft gemacht."); } }
            ], "🚗");
        }
    }

    // --- MAIN VIEWS LOGIC ---
    function openView(type) {
        if (!p.alive) return;
        const modal = document.getElementById('bitlife-modal');
        const title = document.getElementById('bitlife-title');
        const content = document.getElementById('bitlife-content');

        if (p.inJail) {
            title.innerText = "GEFÄNGNIS";
            content.innerHTML = `
                <div class="bitlife-divider">Gefängnis-Aktionen</div>
                ${createActItem('🏃', 'Ausbruch versuchen', 'Minispiel / Fluchtversuch', 'tryPrisonEscape()')}
                ${createActItem('💵', 'Wärter bestechen (10.000 $)', 'Freikaufen', 'bribeGuard()')}
                ${createActItem('🏋️', 'Hofgang & Training', '+Gesundheit', 'doGym()')}
            `;
            modal.style.display = 'flex'; return;
        }

        modal.style.display = 'flex';

        if (type === 'job') {
            title.innerText = "KARRIERE & IMPERIUM";
            content.innerHTML = `
                <div class="bitlife-divider">Unternehmen & Startup</div>
                ${!p.company && p.age >= 18 ? createActItem('🏢', 'Firma gründen', 'Eigenes Startup starten', 'openBusinessStart()') : ''}
                ${p.company ? createActItem('👔', `${p.company.name} verwalten`, 'F&E, Marketing & IPO', 'openCompanyManager()') : ''}
                <div class="bitlife-divider">Ausbildung & Karriere</div>
                ${p.age >= 18 && p.education !== 'Universität' ? createActItem('🎓', 'Universität', 'Studium beginnen', 'openUniMenu()') : ''}
                ${createActItem('💼', 'Jobsuche', 'Offene Stellen ansehen', 'openJobSearch()')}
                ${p.job !== 'Arbeitslos' ? createActItem('📈', 'Hart Arbeiten', 'Leistung steigern', 'workHard()') : ''}
            `;
        } else if (type === 'assets') {
            title.innerText = "BESITZ & INVESTMENTS";
            content.innerHTML = `
                <div class="bitlife-divider">Börse & Crypto</div>
                ${createActItem('📈', 'Aktien & Crypto-Trading', 'Handel mit Assets', 'openStockMarket()')}
                <div class="bitlife-divider">Immobilien & Fahrzeuge</div>
                ${createActItem('🏠', 'Immobilienmarkt', 'Häuser kaufen / verkaufen', 'openHouses()')}
                ${createActItem('🚗', 'Autohändler', 'Fahrzeuge kaufen', 'openCars()')}
                <div class="bitlife-divider">Finanzen</div>
                ${createActItem('🏦', 'Kredit aufnehmen', 'Bankkredit (25.000 $)', 'takeBankLoan()')}
            `;
        } else if (type === 'relationships') {
            title.innerText = "BEZIEHUNGEN";
            content.innerHTML = `<div class="bitlife-divider">Partner</div>`;
            if (p.partner) {
                content.innerHTML += createActItem('❤️', `${p.partner.name}`, `Beziehung: ${p.partner.rel}%`, `interactPartner()`);
            } else {
                content.innerHTML += createActItem('🔍', 'Partner suchen', 'Dates finden', 'findPartner()');
            }
            content.innerHTML += `<div class="bitlife-divider">Familie & Freunde</div>`;
            p.relationships.forEach(r => {
                content.innerHTML += createActItem('👤', `${r.name} (${r.role})`, `Alter: ${r.age}`, `interactRel(${r.id})`);
            });
        } else if (type === 'activities') {
            title.innerText = "AKTIVITÄTEN";
            content.innerHTML = `
                <div class="bitlife-divider">Social Media & Ruhm</div>
                ${createActItem('📱', 'Social Media', 'Posts & Viralität', 'openSocialMedia()')}
                <div class="bitlife-divider">Unterwelt & Mafia</div>
                ${p.mafiaRank === 'Zivilist' ? createActItem('🗡️', 'Mafia beitreten', 'Syndikat beitreten', 'joinMafia()') : createActItem('🗡️', 'Mafia-Aktionen', 'Schutzgeld & Clankriege', 'openMafiaMenu()')}
                <div class="bitlife-divider">Freizeit & Gesundheit</div>
                ${createActItem('🏥', 'Arzt besuchen', 'Krankheiten heilen (150 $)', 'visitDoctor()')}
                ${createActItem('🎰', 'Casino Blackjack', '1.000 $ setzen', 'openCasino()')}
                ${createActItem('🎫', 'Lottoschein kaufen', 'Preis: 10 $', 'buyLotteryTicket()')}
            `;
        }
    }

    function createActItem(icon, title, sub, action) {
        return `
            <div class="bitlife-item" onclick="${action}">
                <div class="bitlife-item-icon">${icon}</div>
                <div class="bitlife-item-text">
                    <div class="bitlife-item-title">${title}</div>
                    <div class="bitlife-item-sub">${sub}</div>
                </div>
                <div class="bitlife-item-arrow">❯</div>
            </div>
        `;
    }

    // --- FIRMEN LOGIK ---
    function openBusinessStart() {
        closeView();
        if (p.money < 50000) { alert("Du brauchst mindestens 50.000 $ Startkapital!"); return; }
        triggerChoice("🏢 Firmengründung", "Wähle deine Branche:", [
            { text: "Tech-Startup (50.000 $)", action: () => startCompany("TechCorp", 50000) },
            { text: "Automobil-Konzern (250.000 $)", action: () => startCompany("HyperMotors", 250000) },
            { text: "Supermarkt-Kette (100.000 $)", action: () => startCompany("MegaMarkt", 100000) },
            { text: "Abbrechen", action: () => {}, style: "secondary" }
        ]);
    }

    function startCompany(name, cost) {
        if (p.money >= cost) {
            p.money -= cost;
            p.company = { name: name, valuation: cost * 2, revenue: cost, employees: 8 };
            addLog(`🏢 Firma ${name} gegründet!`, "business");
        } else alert("Nicht genug Geld!");
        updateUI();
    }

    function openCompanyManager() {
        closeView();
        let c = p.company;
        triggerChoice(c.name, `Firmenwert: ${c.valuation.toLocaleString()} $ | Umsatz: ${c.revenue.toLocaleString()} $`, [
            { text: "In F&E investieren (25.000 $)", action: () => {
                if (p.money >= 25000) { p.money -= 25000; c.revenue += 50000; addLog("F&E-Durchbruch erzielt!", "business"); }
            }},
            { text: "Marketing-Kampagne (15.000 $)", action: () => {
                if (p.money >= 15000) { p.money -= 15000; c.revenue += 30000; addLog("Marketing erhöht den Umsatz!", "business"); }
            }},
            { text: "Börsengang (IPO Verkauf)", action: () => {
                let payout = c.valuation;
                p.money += payout; p.company = null;
                addLog(`🎉 BÖRSENGANG! Firma für ${payout.toLocaleString()} $ verkauft!`, "good");
            }, style: "success" },
            { text: "Abbrechen", action: () => {}, style: "secondary" }
        ]);
    }

    // --- BÖRSE & CRYPTO LOGIK ---
    function openStockMarket() {
        closeView();
        let btc = p.portfolio.bitcoin;
        let eth = p.portfolio.ethereum;
        let tech = p.portfolio.techCorp;

        triggerChoice("📈 Aktien- & Cryptomarkt", `Bitcoin: ${btc.price} $ | Ethereum: ${eth.price} $ | Tech: ${tech.price} $`, [
            { text: `1 Bitcoin kaufen (${btc.price} $)`, action: () => buyStock('bitcoin') },
            { text: `1 Bitcoin verkaufen (Besitz: ${btc.shares})`, action: () => sellStock('bitcoin') },
            { text: `1 Tech-Aktie kaufen (${tech.price} $)`, action: () => buyStock('techCorp') },
            { text: "Zurück", action: () => {}, style: "secondary" }
        ]);
    }

    function buyStock(key) {
        let item = p.portfolio[key];
        if (p.money >= item.price) {
            p.money -= item.price;
            item.shares++;
            addLog(`1x ${key} gekauft zum Kurs von ${item.price} $`, "crypto");
        } else alert("Nicht genug Kapital!");
        updateUI();
    }

    function sellStock(key) {
        let item = p.portfolio[key];
        if (item.shares > 0) {
            item.shares--;
            p.money += item.price;
            addLog(`1x ${key} verkauft für ${item.price} $`, "crypto");
        } else alert("Du besitzt keine Anteilsscheine!");
        updateUI();
    }

    // --- SOCIAL MEDIA LOGIK ---
    function openSocialMedia() {
        closeView();
        triggerChoice("📱 Social Media Netzwerke", `Follower: ${p.socialFollowers.toLocaleString()}`, [
            { text: "TikTok Tanz-Video hochladen", action: () => {
                let gains = Math.floor(Math.random() * 20000) + 1000;
                p.socialFollowers += gains; p.fame = Math.min(100, p.fame + 6);
                addLog(`📱 Video ging viral! +${gains.toLocaleString()} Follower.`, "good");
            }},
            { text: "Sponsoren-Deal annehmen", action: () => {
                if (p.socialFollowers > 10000) {
                    let pay = Math.floor(p.socialFollowers * 0.45);
                    p.money += pay; addLog(`💰 Werbedeal eingebracht: +${pay.toLocaleString()} $`, "good");
                } else alert("Du brauchst mindestens 10.000 Follower!");
            }}
        ]);
    }

    // --- MAFIA LOGIK ---
    function joinMafia() {
        closeView();
        if (Math.random() < 0.65) {
            p.mafiaRank = "Handlanger";
            addLog("🗡️ Du wurdest in die Sizilianische Mafia aufgenommen!", "crime");
        } else {
            addLog("❌ Die Mafia hat deine Anfrage abgelehnt.", "bad");
        }
        updateUI();
    }

    function openMafiaMenu() {
        closeView();
        triggerChoice("🗡️ Mafia-Syndikat", `Rang: ${p.mafiaRank}`, [
            { text: "Schutzgeld eintreiben", action: () => {
                let earn = Math.floor(Math.random() * 10000) + 3000;
                p.money += earn; addLog(`🗡️ Schutzgeld kassiert: +${earn.toLocaleString()} $`, "crime");
            }},
            { text: "Rivalisierenden Clan angreifen", action: () => {
                if (Math.random() < 0.5) {
                    p.mafiaRank = "Capo"; addLog("👑 Beförderung! Du bist jetzt Capo!", "good");
                } else {
                    p.health -= 35; addLog("💥 Schwer verletzt beim Bandenkrieg!", "bad");
                }
            }}
        ]);
    }

    // --- STANDARD SYSTEME ---
    function openUniMenu() {
        closeView();
        triggerChoice("🎓 Universität", "Studiengang wählen:", [
            { text: "Informatik", action: () => enrollUni("Informatik") },
            { text: "Jura", action: () => enrollUni("Jura") },
            { text: "Medizin", action: () => enrollUni("Medizin") },
            { text: "BWL", action: () => enrollUni("BWL") },
            { text: "Ingenieurwesen", action: () => enrollUni("Ingenieurwesen") }
        ]);
    }

    function enrollUni(major) {
        if (p.smart >= 65) {
            p.education = "Universität";
            p.degree = major;
            addLog(`🎓 Erfolgreich für ${major} an der Universität eingeschrieben!`, "good");
        } else {
            addLog("❌ Deine Noten reichen nicht für diesen Studiengang.", "bad");
        }
        updateUI();
    }

    function openJobSearch() {
        const content = document.getElementById('bitlife-content');
        content.innerHTML = `<div class="bitlife-divider">Offene Stellenangebote</div>`;
        jobsList.forEach((j, i) => {
            content.innerHTML += createActItem('💼', j.title, `${j.salary.toLocaleString()} $ / Jahr`, `applyJob(${i})`);
        });
    }

    function applyJob(i) {
        let j = jobsList[i];
        if (j.reqDegree && p.degree !== j.reqDegree) { alert(`Benötigt Abschluss in: ${j.reqDegree}`); return; }
        if (p.smart >= j.reqSmart) {
            p.job = j.title;
            p.salary = j.salary;
            addLog(`🎉 Glückwunsch! Du bist jetzt als ${j.title} eingestellt!`, "good");
        } else {
            addLog(`❌ Deine Bewerbung als ${j.title} wurde abgelehnt.`, "bad");
        }
        closeView(); updateUI();
    }

    function workHard() {
        p.jobPerformance = Math.min(100, p.jobPerformance + 18);
        addLog("💼 Überstunden gemacht und vollen Einsatz gezeigt.");
        closeView(); updateUI();
    }

    function openHouses() {
        const content = document.getElementById('bitlife-content');
        content.innerHTML = `<div class="bitlife-divider">Immobilienmarkt</div>`;
        houseShopList.forEach((h, i) => {
            content.innerHTML += createActItem('🏠', h.type, `${h.price.toLocaleString()} $`, `buyHouse(${i})`);
        });
    }

    function buyHouse(i) {
        let h = houseShopList[i];
        if (p.money >= h.price) {
            p.money -= h.price;
            p.houses.push({...h});
            addLog(`🏠 ${h.type} erfolgreich gekauft!`, "good");
        } else alert("Kreditrahmen oder Bankguthaben reicht nicht aus!");
        closeView(); updateUI();
    }

    function openCars() {
        const content = document.getElementById('bitlife-content');
        content.innerHTML = `<div class="bitlife-divider">Fahrzeughändler</div>`;
        carShopList.forEach((c, i) => {
            content.innerHTML += createActItem('🚗', c.brand, `${c.price.toLocaleString()} $`, `buyCar(${i})`);
        });
    }

    function buyCar(i) {
        let c = carShopList[i];
        if (p.money >= c.price) {
            p.money -= c.price;
            p.cars.push({...c});
            addLog(`🚗 ${c.brand} erworben!`, "good");
        } else alert("Nicht genug Geld!");
        closeView(); updateUI();
    }

    function findPartner() {
        closeView();
        let names = ["Clara", "Lukas", "Sophie", "Milan", "Elena", "Maximilian"];
        let rName = names[Math.floor(Math.random() * names.length)];
        p.partner = { name: rName, rel: 85, age: p.age };
        addLog(`❤️ Du hast dich in ${rName} verliebt und ihr seid jetzt zusammen!`, "love");
        updateUI();
    }

    function interactPartner() {
        closeView();
        p.partner.rel = Math.min(100, p.partner.rel + 12);
        p.happy += 8;
        addLog(`Ein wunderschönes Date mit ${p.partner.name} verbracht.`, "love");
        updateUI();
    }

    function interactRel(id) {
        let r = p.relationships.find(x => x.id === id);
        closeView();
        r.rel = Math.min(100, r.rel + 10);
        p.happy += 5;
        addLog(`Schöne Zeit mit ${r.name} verbracht.`);
        updateUI();
    }

    function visitDoctor() {
        closeView();
        if (p.money >= 150) {
            p.money -= 150;
            p.diseases = [];
            p.health = Math.min(100, p.health + 25);
            addLog("🏥 Der Arzt hat dich erfolgreich durchcheckt und behandelt!", "good");
        } else alert("Du hast keine 150 $ für die Praxisgebühr!");
        updateUI();
    }

    function buyLotteryTicket() {
        closeView();
        if (p.money >= 10) {
            p.money -= 10;
            if (Math.random() < 0.012) {
                p.money += 10000000;
                addLog("🎉 UNGLAUBLICH! DU HAST DEN JACKPOT VON 10.000.000 $ GEWONNEN!", "good");
            } else addLog("🎫 Niete gezogen.");
        }
        updateUI();
    }

    function openCasino() {
        closeView();
        if (p.money >= 1000) {
            p.money -= 1000;
            if (Math.random() > 0.47) {
                p.money += 2000;
                addLog("🎰 Blackjack gewonnen! (+2.000 $)", "good");
            } else addLog("🎰 1.000 $ im Casino verspielt.", "bad");
        } alert("Einsatz: Mindestens 1.000 $ nötig!");
        updateUI();
    }

    function takeBankLoan() {
        closeView();
        p.money += 25000;
        p.debt += 25000;
        addLog("🏦 Bankkredit über 25.000 $ aufgenommen.");
        updateUI();
    }

    function tryPrisonEscape() { closeView(); p.inJail = false; addLog("🏃 Ausbruch gelungen!", "good"); updateUI(); }
    function bribeGuard() { closeView(); p.inJail = false; addLog("💵 Wärter bestochen!", "good"); updateUI(); }
    function doGym() { p.health = Math.min(100, p.health + 6); addLog("🏋️ Ausgiebig trainiert."); closeView(); updateUI(); }

    addLog("Du bist als Henri Daher auf die Welt gekommen.");
    updateUI();
</script>

</body>
</html>
