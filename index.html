<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BitLife Web Edition</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b1928;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            background-color: #0f2337;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        /* Top Header */
        .header {
            background-color: #0a1826;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #00529b;
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            color: #ffce00;
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: #9bb7d4;
        }

        /* Log / Event Box */
        .log-box {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            background: #0f2337;
            display: flex;
            flex-direction: column-reverse;
        }
        .log-entry {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.4;
            border-left: 3px solid #ffce00;
        }

        /* Middle Navigation Bar */
        .nav-bar {
            display: flex;
            background-color: #00529b;
            height: 80px;
            align-items: center;
            position: relative;
            border-top: 1px solid #0068c4;
            border-bottom: 1px solid #003e75;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            height: 100%;
        }
        .nav-icon {
            width: 36px;
            height: 36px;
            background-color: #00bcd4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 4px;
            color: white;
        }
        
        .nav-item.center {
            position: relative;
            z-index: 10;
        }
        .age-btn {
            width: 75px;
            height: 75px;
            background-color: #28a745;
            border: 4px solid #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            margin-top: -15px;
        }
        .age-btn .plus {
            font-size: 24px;
            line-height: 1;
        }

        /* Bottom Stats Table */
        .stats-section {
            background-color: #0a1826;
            padding: 15px;
            border-top: 1px solid #1a3048;
        }
        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .stat-row:last-child {
            margin-bottom: 0;
        }
        .stat-label {
            width: 100px;
            font-size: 12px;
            font-weight: bold;
            color: #d1e2f3;
        }
        .stat-bar-bg {
            flex-grow: 1;
            height: 12px;
            background-color: #12283e;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #1a3858;
        }
        .stat-bar-fill {
            height: 100%;
            background-color: #28a745;
            width: 50%;
            transition: width 0.3s ease;
        }

        /* Modals (für Menüs) */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            flex-direction: column;
            padding: 20px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #00529b;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .modal-title { font-size: 18px; font-weight: bold; color: #ffce00; }
        .close-btn { background: #dc3545; border: none; color: white; padding: 5px 12px; border-radius: 5px; cursor: pointer; }
        .modal-body { overflow-y: auto; flex-grow: 1; }
        .card {
            background: #102538;
            border: 1px solid #1c3c5a;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .card-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; color: #ffce00; }
        .card-sub { font-size: 12px; color: #9bb7d4; margin-bottom: 8px; }
        .btn-action-modal {
            background: #28a745;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn-action-modal:hover { background: #218838; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <h1 id="char-name">Henri</h1>
        <p><span id="char-job">Kleinkind</span> | Bankkonto: <span id="char-money">0 €</span></p>
    </div>

    <!-- Event Log -->
    <div class="log-box" id="log-box"></div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <button class="nav-item" onclick="openJobMenu()">
            <div class="nav-icon">💼</div>
            Beruf
        </button>
        <button class="nav-item" onclick="openMenu('Besitz')">
            <div class="nav-icon">💰</div>
            Besitz
        </button>
        
        <button class="nav-item center" onclick="ageUp()">
            <div class="age-btn">
                <span class="plus">+</span>
                <span>Alter</span>
            </div>
        </button>

        <button class="nav-item" onclick="openRelationships()">
            <div class="nav-icon">❤️</div>
            Beziehungen
        </button>
        <button class="nav-item" onclick="openMenu('Aktivitäten')">
            <div class="nav-icon">•••</div>
            Aktivitäten
        </button>
    </div>

    <!-- Stats Table -->
    <div class="stats-section">
        <div class="stat-row">
            <span class="stat-label">Glücklich:</span>
            <div class="stat-bar-bg"><div id="bar-happy" class="stat-bar-fill"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Gesundheit:</span>
            <div class="stat-bar-bg"><div id="bar-health" class="stat-bar-fill"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Intelligenz:</span>
            <div class="stat-bar-bg"><div id="bar-smart" class="stat-bar-fill"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Aussehen:</span>
            <div class="stat-bar-bg"><div id="bar-looks" class="stat-bar-fill"></div></div>
        </div>
    </div>

    <!-- Modal für Beziehungen -->
    <div id="rel-modal" class="modal">
        <div class="modal-header">
            <span class="modal-title">❤️ Beziehungen</span>
            <button class="close-btn" onclick="closeModal('rel-modal')">X</button>
        </div>
        <div id="rel-list" class="modal-body"></div>
    </div>

    <!-- Modal für Beruf -->
    <div id="job-modal" class="modal">
        <div class="modal-header">
            <span class="modal-title">💼 Beruf & Karriere</span>
            <button class="close-btn" onclick="closeModal('job-modal')">X</button>
        </div>
        <div id="job-content" class="modal-body"></div>
    </div>
</div>

<script>
    const femaleNames = ["Julia", "Sarah", "Laura", "Anna", "Lisa", "Lena", "Katharina"];
    const maleNames = ["Michael", "Stefan", "Thomas", "Christian", "Lukas", "Felix", "David"];

    let p = {
        name: "Henri",
        age: 0,
        money: 0,
        status: "Kleinkind",
        job: "Keiner",
        salary: 0,
        health: Math.floor(Math.random() * 70) + 30,
        happy: Math.floor(Math.random() * 70) + 30,
        smart: Math.floor(Math.random() * 70) + 30,
        looks: Math.floor(Math.random() * 70) + 30,
        alive: true,
        relationships: []
    };

    function initFamily() {
        p.relationships.push({
            id: 1, role: "Mutter", name: femaleNames[Math.floor(Math.random() * femaleNames.length)],
            age: Math.floor(Math.random() * 12) + 24, rel: Math.floor(Math.random() * 40) + 60, alive: true
        });
        p.relationships.push({
            id: 2, role: "Vater", name: maleNames[Math.floor(Math.random() * maleNames.length)],
            age: Math.floor(Math.random() * 15) + 26, rel: Math.floor(Math.random() * 40) + 60, alive: true
        });
        let sibCount = Math.floor(Math.random() * 3);
        for(let i = 0; i < sibCount; i++) {
            let isSister = Math.random() < 0.5;
            p.relationships.push({
                id: 3 + i, role: isSister ? "Schwester" : "Bruder",
                name: isSister ? femaleNames[Math.floor(Math.random() * femaleNames.length)] : maleNames[Math.floor(Math.random() * maleNames.length)],
                age: Math.floor(Math.random() * 5) + 1, rel: Math.floor(Math.random() * 50) + 50, alive: true
            });
        }
    }

    function updateUI() {
        document.getElementById('char-name').innerText = `${p.name} (Alter ${p.age})`;
        document.getElementById('char-job').innerText = p.job !== "Keiner" ? p.job : p.status;
        document.getElementById('char-money').innerText = p.money + " €";

        document.getElementById('bar-happy').style.width = p.happy + "%";
        document.getElementById('bar-health').style.width = p.health + "%";
        document.getElementById('bar-smart').style.width = p.smart + "%";
        document.getElementById('bar-looks').style.width = p.looks + "%";
    }

    function addLog(text) {
        const box = document.getElementById('log-box');
        box.innerHTML = `<div class="log-entry"><strong>Alter ${p.age}:</strong> ${text}</div>` + box.innerHTML;
    }

    function ageUp() {
        if (!p.alive) return;

        p.age++;

        // Gehalt auszahlen
        if (p.salary > 0) {
            p.money += p.salary;
            addLog(`💰 Du hast dein Jahresgehalt von ${p.salary} € erhalten.`);
        }

        // Familien-Alterung
        p.relationships.forEach(r => {
            if (r.alive) {
                r.age++;
                if (r.age > 80 && Math.random() < 0.25) {
                    r.alive = false;
                    addLog(`🪦 Deine(e) ${r.role} ${r.name} ist im Alter von ${r.age} Jahren gestorben.`);
                    p.happy = Math.max(0, p.happy - 30);
                }
            }
        });

        // Schule & Status
        if (p.age === 6) {
            p.status = "Grundschule";
            addLog("🎒 Du wurdest in der Grundschule eingeschult!");
        } else if (p.age === 10) {
            p.status = "Sekundarschule";
            addLog("🏫 Du bist auf die Sekundarschule gewechselt!");
        } else if (p.age === 14) {
            p.status = "Schulabschluss gemacht";
            addLog("🎓 Du hast deinen Schulabschluss erreicht! Du kannst dir jetzt Jobs suchen.");
        }

        let rand = Math.random();
        if (rand < 0.2) {
            p.happy = Math.min(100, p.happy + 8);
            addLog("Du hattest einen wunderschönen Tag!");
        } else if (rand < 0.35) {
            p.health = Math.max(0, p.health - 10);
            addLog("Du hast dich erkältet (-Gesundheit).");
        } else {
            addLog("Ein ganz normales Jahr vergeht.");
        }

        if (p.health <= 0) {
            p.alive = false;
            addLog("🪦 Du bist leider gestorben.");
        }

        updateUI();
    }

    // Berufssystem Logik
    function openJobMenu() {
        if (!p.alive) return;
        if (p.age < 14) {
            addLog("🔒 Du bist noch zu jung zum Arbeiten! Der Bereich 'Beruf' schaltet sich erst ab 14 Jahren frei.");
            return;
        }

        const content = document.getElementById('job-content');
        content.innerHTML = "";

        if (p.job !== "Keiner") {
            content.innerHTML += `
                <div class="card">
                    <div class="card-title">Aktueller Job: ${p.job}</div>
                    <div class="card-sub">Gehalt: ${p.salary} € / Jahr</div>
                    <button class="btn-action-modal" style="background:#dc3545;" onclick="quitJob()">Kündigen</button>
                </div>
            `;
        }

        content.innerHTML += `<div style="margin: 10px 0; font-weight:bold; color:#ffce00;">Verfügbare Vollzeit- & Teilzeitjobs:</div>`;

        const availableJobs = [
            { title: "Supermarkt-Aushilfe", minAge: 14, minSmart: 0, salary: 12000 },
            { title: "Kellner", minAge: 16, minSmart: 20, salary: 22000 },
            { title: "Junior Softwareentwickler", minAge: 18, minSmart: 60, salary: 48000 },
            { title: "Arzt", minAge: 24, minSmart: 85, salary: 110000 }
        ];

        availableJobs.forEach(j => {
            if (p.age >= j.minAge) {
                content.innerHTML += `
                    <div class="card">
                        <div class="card-title">${j.title}</div>
                        <div class="card-sub">Gehalt: ${j.salary} €/Jahr | Min. Intelligenz: ${j.minSmart}%</div>
                        <button class="btn-action-modal" onclick="takeJob('${j.title}', ${j.salary}, ${j.minSmart})">Annehmen</button>
                    </div>
                `;
            } else {
                content.innerHTML += `
                    <div class="card" style="opacity: 0.5;">
                        <div class="card-title">${j.title} (Gesperrt)</div>
                        <div class="card-sub">Erfordert Alter: ${j.minAge} Jahre</div>
                    </div>
                `;
            }
        });

        document.getElementById('job-modal').style.display = 'flex';
    }

    function takeJob(title, salary, minSmart) {
        if (p.smart < minSmart) {
            addLog(`❌ Deine Intelligenz ist zu niedrig für den Job als ${title}!`);
            closeModal('job-modal');
            return;
        }
        p.job = title;
        p.salary = salary;
        addLog(`🎉 Du wurdest als ${title} eingestellt!`);
        closeModal('job-modal');
        updateUI();
    }

    function quitJob() {
        addLog(`Du hast deinen Job als ${p.job} gekündigt.`);
        p.job = "Keiner";
        p.salary = 0;
        closeModal('job-modal');
        updateUI();
    }

    function openRelationships() {
        if (!p.alive) return;
        const list = document.getElementById('rel-list');
        list.innerHTML = "";
        p.relationships.filter(r => r.alive).forEach(r => {
            list.innerHTML += `
                <div class="card">
                    <div class="card-title">${r.role}: ${r.name} (${r.age} Jahre)</div>
                    <div class="stat-row" style="margin-top:5px;">
                        <span class="stat-label">Beziehung:</span>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${r.rel}%"></div></div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px;">
                        <button class="btn-action-modal" onclick="interactRel(${r.id}, 'spend')">Zeit verbringen</button>
                        <button class="btn-action-modal" onclick="interactRel(${r.id}, 'gift')">Geschenk (10€)</button>
                    </div>
                </div>
            `;
        });
        document.getElementById('rel-modal').style.display = 'flex';
    }

    function interactRel(id, type) {
        let r = p.relationships.find(item => item.id === id);
        if (!r) return;
        if (type === 'spend') {
            r.rel = Math.min(100, r.rel + 10);
            p.happy = Math.min(100, p.happy + 5);
            addLog(`Du hast tolle Zeit mit deine(r/m) ${r.role} ${r.name} verbracht.`);
        } else if (type === 'gift') {
            if (p.money >= 10) {
                p.money -= 10;
                r.rel = Math.min(100, r.rel + 20);
                addLog(`Du hast ${r.name} ein Geschenk gemacht!`);
            } else {
                addLog("Du hast nicht genug Geld für ein Geschenk!");
            }
        }
        updateUI();
        openRelationships();
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    function openMenu(menuName) {
        if (!p.alive) return;
        addLog(`Menü "${menuName}" wurde geöffnet.`);
    }

    initFamily();
    addLog("Du wurdest geboren!");
    updateUI();
</script>

</body>
</html>
