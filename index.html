<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BitLife - Life Simulator Ultimate</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #030712;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 460px;
            height: 100vh;
            max-height: 960px;
            background-color: #0b1528;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 80px rgba(0,0,0,0.95);
            position: relative;
            overflow: hidden;
        }

        /* BITLIFE TOPBAND */
        .bitlife-topband {
            background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
            color: #000000;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 4px solid #854d0e;
        }
        .bitlife-topband h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }
        .bitlife-topband .subtitle {
            font-size: 12px;
            font-weight: 800;
            margin-top: 3px;
            color: #1e293b;
            text-transform: uppercase;
        }
        .bitlife-finance-bar {
            background-color: #0f172a;
            color: #ffffff;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            font-weight: 800;
            border-bottom: 2px solid #1e293b;
        }

        /* LOG BOX */
        .log-box {
            flex-grow: 1;
            padding: 14px;
            overflow-y: auto;
            background: #030712;
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
        }
        .log-entry {
            background: #0f172a;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 13.5px;
            line-height: 1.5;
            border-left: 6px solid #facc15;
            color: #f1f5f9;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .log-entry.good { border-left-color: #22c55e; }
        .log-entry.bad { border-left-color: #ef4444; }
        .log-entry.love { border-left-color: #ec4899; }
        .log-entry.crime { border-left-color: #a855f7; }
        .log-entry.ghost { border-left-color: #06b6d4; }
        .log-entry.business { border-left-color: #f59e0b; }
        .log-entry.crypto { border-left-color: #8b5cf6; }

        /* NAV BAR */
        .nav-bar {
            display: flex;
            background-color: #0f172a;
            height: 76px;
            align-items: center;
            position: relative;
            border-top: 2px solid #1e293b;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 9.5px;
            font-weight: 800;
            background: none;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }
        .nav-icon { font-size: 22px; margin-bottom: 3px; }
        
        .age-btn-wrapper {
            position: relative;
            z-index: 50;
            margin-top: -34px;
        }
        .age-btn {
            width: 88px;
            height: 88px;
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            border: 4px solid #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 900;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            cursor: pointer;
            transition: transform 0.08s ease;
        }
        .age-btn:active { transform: scale(0.92); }
        .age-btn .plus-icon { font-size: 28px; line-height: 1; font-weight: 900; }
        .age-btn .age-text { font-size: 11.5px; letter-spacing: 0.5px; }

        /* STATS BARS */
        .stats-section {
            background-color: #030712;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            border-top: 1px solid #1e293b;
        }
        .stat-row { display: flex; align-items: center; }
        .stat-label { width: 100px; font-size: 11px; font-weight: 900; color: #94a3b8; text-transform: uppercase; }
        .stat-bar-bg {
            flex-grow: 1;
            height: 12px;
            background-color: #1e293b;
            border-radius: 6px;
            overflow: hidden;
        }
        .stat-bar-fill { height: 100%; transition: width 0.3s ease; }
        .fill-happy { background: #eab308; }
        .fill-health { background: #22c55e; }
        .fill-smart { background: #3b82f6; }
        .fill-looks { background: #ec4899; }
        .fill-fame { background: #a855f7; }

        /* MODALS & OVERLAYS */
        .bitlife-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff;
            color: #000000;
            z-index: 200;
            flex-direction: column;
        }
        .bitlife-header {
            background: #0f172a;
            color: white;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .bitlife-header h2 {
            margin: 0; font-size: 17px; font-weight: 900; text-transform: uppercase;
        }
        .bitlife-close-btn {
            background: rgba(255,255,255,0.2); border: none; color: white;
            width: 32px; height: 32px; border-radius: 50%; font-weight: bold; cursor: pointer;
        }
        .bitlife-menu-list { flex-grow: 1; overflow-y: auto; background: #f8fafc; }

        .bitlife-item {
            display: flex; align-items: center; padding: 14px 18px;
            border-bottom: 1px solid #e2e8f0; cursor: pointer; background: #ffffff;
        }
        .bitlife-item:active { background: #f1f5f9; }
        .bitlife-item-icon { font-size: 24px; margin-right: 14px; width: 32px; text-align: center; }
        .bitlife-item-text { flex-grow: 1; }
        .bitlife-item-title { font-weight: 800; font-size: 14px; color: #0f172a; }
        .bitlife-item-sub { font-size: 12px; color: #64748b; margin-top: 2px; }
        .bitlife-item-arrow { color: #0f172a; font-weight: bold; font-size: 14px; }

        .bitlife-divider {
            background: #334155; color: white; padding: 7px 18px;
            font-size: 10.5px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .choice-overlay {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.92); z-index: 300;
            justify-content: center; align-items: center; padding: 22px;
        }
        .choice-card {
            background: #ffffff; color: #000000; width: 100%;
            border-radius: 16px; padding: 24px; text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
        }
        .choice-icon { font-size: 48px; margin-bottom: 10px; }
        .choice-title { font-size: 19px; font-weight: 900; color: #0f172a; margin-bottom: 8px; }
        .choice-desc { font-size: 13.5px; color: #334155; margin-bottom: 20px; line-height: 1.5; }
        .choice-option-btn {
            width: 100%; padding: 13px; margin-bottom: 10px;
            background: #0f172a; color: white; border: none;
            border-radius: 8px; font-weight: 800; font-size: 13.5px; cursor: pointer;
        }
        .choice-option-btn:last-child { margin-bottom: 0; }
        .choice-option-btn.danger { background: #ef4444; }
        .choice-option-btn.secondary { background: #64748b; }
        .choice-option-btn.success { background: #22c55e; }

        .death-screen {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #030712; color: white; z-index: 500;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center;
        }
        .tombstone {
            background: #1e293b; border: 4px solid #475569;
            border-top-left-radius: 120px; border-top-right-radius: 120px;
            width: 270px; padding: 50px 20px 30px 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.95); margin-bottom: 30px;
        }
        .tombstone h2 { margin: 0; font-size: 28px; font-weight: 900; color: #f8fafc; }
        .tombstone p { margin: 8px 0; font-size: 14px; color: #cbd5e1; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="bitlife-topband">
        <h1 id="char-name">Henri Daher</h1>
        <div class="subtitle" id="char-job">Schüler</div>
    </div>
    <div class="bitlife-finance-bar">
        <span>ALTER: <strong id="char-age">14</strong></span>
        <span>BANK: <strong id="char-money">500 $</strong></span>
        <span>NETTO: <strong id="char-networth">500 $</strong></span>
    </div>

    <div class="log-box" id="log-box"></div>

    <div class="nav-bar">
        <button class="nav-item" onclick="openView('job')">
            <div class="nav-icon">💼</div>
            Karriere
        </button>
        <button class="nav-item" onclick="openView('assets')">
            <div class="nav-icon">🏠</div>
            Besitz
        </button>
        
        <div class="age-btn-wrapper">
            <button class="age-btn" onclick="ageUp()">
                <span class="plus-icon">+</span>
                <span class="age-text">AGE</span>
            </button>
        </div>

        <button class="nav-item" onclick="openView('relationships')">
            <div class="nav-icon">❤️</div>
            Kontakte
        </button>
        <button class="nav-item" onclick="openView('activities')">
            <div class="nav-icon">🎬</div>
            Aktivitäten
        </button>
    </div>

    <div class="stats-section">
        <div class="stat-row">
            <span class="stat-label">Glück</span>
            <div class="stat-bar-bg"><div id="bar-happy" class="stat-bar-fill fill-happy"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Gesundheit</span>
            <div class="stat-bar-bg"><div id="bar-health" class="stat-bar-fill fill-health"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Smartness</span>
            <div class="stat-bar-bg"><div id="bar-smart" class="stat-bar-fill fill-smart"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Aussehen</span>
            <div class="stat-bar-bg"><div id="bar-looks" class="stat-bar-fill fill-looks"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Ruhm / Fame</span>
            <div class="stat-bar-bg"><div id="bar-fame" class="stat-bar-fill fill-fame"></div></div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="bitlife-modal" class="bitlife-modal">
        <div class="bitlife-header">
            <button class="bitlife-close-btn" onclick="closeView()">✕</button>
            <h2 id="bitlife-title">MENÜ</h2>
            <div style="width:32px;"></div>
        </div>
        <div class="bitlife-menu-list" id="bitlife-content"></div>
    </div>

    <div id="choice-overlay" class="choice-overlay">
        <div class="choice-card">
            <div id="choice-icon" class="choice-icon">❓</div>
            <div id="choice-title" class="choice-title">ENTSCHEIDUNG</div>
            <div id="choice-desc" class="choice-desc">Was möchtest du tun?</div>
            <div id="choice-options"></div>
        </div>
    </div>

    <div id="death-screen" class="death-screen">
        <div class="tombstone">
            <div style="font-size:42px; margin-bottom:12px;">🪦</div>
            <h2>R.I.P.</h2>
            <p id="death-name">Henri Daher</p>
            <p id="death-years" style="font-weight:bold; color:white; margin-top:12px;">14 - 82 Jahre</p>
            <p id="death-cause" style="font-size:12.5px; margin-top:16px;"></p>
        </div>
        <button onclick="location.reload()" class="choice-option-btn success" style="max-width:250px;">Neues Leben beginnen</button>
    </div>
</div>

<script>
    // --- GLOBAL PLAYER STATE ---
    let p = {
        name: "Henri Daher",
        age: 14,
        country: "Deutschland",
        money: 500,
        debt: 0,
        status: "Schüler",
        schoolGrade: 85,
        education: "Gymnasium",
        degree: null,
        hasDriverLicense: false,
        job: "Arbeitslos",
        jobPerformance: 50,
        salary: 0,
        partTimeJob: null,
        partTimeSalary: 0,
        yearsInJob: 0,
        happy: 85,
        health: 90,
        smart: 80,
        looks: 75,
        fame: 0,
        socialFollowers: 0,
        alive: true,
        inJail: false,
        jailYears: 0,
        addicted: false,
        addictionType: null,
        diseases: [],
        partner: null,
        children: [],
        houses: [],
        cars: [],
        pets: [],
        jewelry: [],
        
        // BUSINESS EMPIRE
        company: null,
        
        // STOCKS & CRYPTO PORTFOLIO
        portfolio: {
            bitcoin: { shares: 0, price: 42000 },
            ethereum: { shares: 0, price: 2800 },
            techCorp: { shares: 0, price: 180 },
            energyGlobal: { shares: 0, price: 95 },
            realEstateTrust: { shares: 0, price: 310 },
            goldReserve: { shares: 0, price: 2100 }
        },
        
        // MAFIA & CRIME
        mafiaRank: "Zivilist",
        mafiaSyndicate: null,
        criminalRecord: [],

        // RELATIONS
        relationships: [
            { id: 1, name: "Yamila Daher", role: "Mutter", age: 42, rel: 90 },
            { id: 2, name: "Aladdin Antoun", role: "Stiefvater", age: 45, rel: 65 },
            { id: 3, name: "Saladin Antoun", role: "Halb-Bruder", age: 10, rel: 60 },
            { id: 4, name: "Adham Baba", role: "Bester Freund", age: 14, rel: 85 }
        ]
    };

    // --- DATA TABLES ---
    const partTimeJobsList = [
        { title: "🐶 Hundesitter", salary: 3200, reqAge: 13 },
        { title: "📰 Zeitungsausträger", salary: 4100, reqAge: 13 },
        { title: "📚 Nachhilfelehrer", salary: 6500, reqAge: 15 },
        { title: "☕ Barista (Aushilfe)", salary: 8400, reqAge: 16 },
        { title: "🍔 Fast-Food Kassenkraft", salary: 9200, reqAge: 16 },
        { title: "🚲 Lieferando-Fahrer", salary: 11000, reqAge: 17 }
    ];

    const jobsList = [
        // Einsteiger & Service
        { title: "☕ Barista", salary: 24000, reqSmart: 10, reqLooks: 0, reqDegree: null },
        { title: "🚕 Taxifahrer/in", salary: 31000, reqSmart: 20, reqLooks: 0, reqDegree: null, reqLicense: true },
        { title: "📋 Büroassistent/in", salary: 36000, reqSmart: 35, reqLooks: 0, reqDegree: null },
        { title: "👮 Polizeibeamter/in", salary: 48000, reqSmart: 50, reqLooks: 0, reqDegree: null },
        { title: "🏫 Grundschullehrer/in", salary: 52000, reqSmart: 60, reqLooks: 0, reqDegree: "Pädagogik" },

        // Tech & Business
        { title: "💻 Junior Software-Entwickler", salary: 72000, reqSmart: 65, reqLooks: 0, reqDegree: "Informatik" },
        { title: "🚀 Senior Software Engineer", salary: 128000, reqSmart: 78, reqLooks: 0, reqDegree: "Informatik" },
        { title: "📈 Investmentbanker", salary: 145000, reqSmart: 85, reqLooks: 0, reqDegree: "BWL" },
        { title: "👔 Unternehmensberater", salary: 98000, reqSmart: 75, reqLooks: 0, reqDegree: "BWL" },

        // Medizin & Recht
        { title: "⚖️ Anwalt / Anwältin", salary: 115000, reqSmart: 82, reqLooks: 0, reqDegree: "Jura" },
        { title: "👩‍⚖️ Richter/in", salary: 165000, reqSmart: 90, reqLooks: 0, reqDegree: "Jura" },
        { title: "🩺 Assistenzarzt / Ärztin", salary: 102000, reqSmart: 85, reqLooks: 0, reqDegree: "Medizin" },
        { title: "🏥 Chefarzt / Chefärztin", salary: 235000, reqSmart: 92, reqLooks: 0, reqDegree: "Medizin" },

        // Spezial & High Fame
        { title: "✈️ Verkehrsflugzeug-Pilot", salary: 140000, reqSmart: 80, reqLooks: 0, reqDegree: "Ingenieurwesen", reqLicense: true },
        { title: "💃 Supermodel", salary: 190000, reqSmart: 20, reqLooks: 88, reqDegree: null },
        { title: "🎬 Hollywood-Schauspieler/in", salary: 310000, reqSmart: 40, reqLooks: 80, reqDegree: "Kunst" },
        { title: "⚽ Profi-Fußballer", salary: 450000, reqSmart: 30, reqLooks: 50, reqDegree: null }
    ];

    const houseShopList = [
        { type: "Kleine Eigentumswohnung", price: 120000, upkeep: 1400 },
        { type: "Modernes Reihenhaus", price: 290000, upkeep: 3100 },
        { type: "Einfamilienhaus mit Garten", price: 480000, upkeep: 5200 },
        { type: "👻 Alte Spukvilla", price: 220000, upkeep: 2800 },
        { type: "Luxusvilla mit Infinity-Pool", price: 1850000, upkeep: 18000 },
        { type: "Penthousedachwohnung", price: 2400000, upkeep: 22000 }
    ];

    const carShopList = [
        { brand: "Gebrauchter Kleinwagen", price: 4200 },
        { brand: "Familien-Kombi", price: 28000 },
        { brand: "Elektro-Limousine", price: 54000 },
        { brand: "Luxus SUV", price: 88000 },
        { brand: "Sportwagen V8", price: 135000 },
        { brand: "Hypercar V12", price: 450000 }
    ];

    // --- HELPER FUNCTIONS ---
    function calculateNetWorth() {
        let houseVal = p.houses.reduce((acc, h) => acc + h.price, 0);
        let carVal = p.cars.reduce((acc, c) => acc + c.price, 0);
        let stockVal = 0;
        for (let key in p.portfolio) {
            stockVal += p.portfolio[key].shares * p.portfolio[key].price;
        }
        let compVal = p.company ? p.company.valuation : 0;
        return (p.money - p.debt) + houseVal + carVal + stockVal + compVal;
    }

    function updateUI() {
        document.getElementById('char-name').innerText = p.name;
        document.getElementById('char-age').innerText = p.age;
        document.getElementById('char-money').innerText = p.money.toLocaleString() + " $";
        document.getElementById('char-networth').innerText = calculateNetWorth().toLocaleString() + " $";
        
        let jobText = p.status;
        if (p.inJail) jobText = "🔒 Im Gefängnis";
        else if (p.company) jobText = `👔 CEO von ${p.company.name}`;
        else if (p.mafiaRank !== "Zivilist") jobText = `🗡️ Mafia: ${p.mafiaRank}`;
        else if (p.job !== "Arbeitslos") {
            jobText = p.job;
            if (p.partTimeJob) jobText += ` (+${p.partTimeJob})`;
        } else if (p.partTimeJob) {
            jobText = `⏱️ ${p.partTimeJob}`;
        }
        document.getElementById('char-job').innerText = jobText;

        document.getElementById('bar-happy').style.width = p.happy + "%";
        document.getElementById('bar-health').style.width = p.health + "%";
        document.getElementById('bar-smart').style.width = p.smart + "%";
        document.getElementById('bar-looks').style.width = p.looks + "%";
        document.getElementById('bar-fame').style.width = p.fame + "%";
    }

    function addLog(text, type = "normal") {
        const box = document.getElementById('log-box');
        let cssClass = "log-entry " + type;
        box.innerHTML = `<div class="${cssClass}"><strong>Alter ${p.age}:</strong> ${text}</div>` + box.innerHTML;
    }

    function clampStats() {
        p.happy = Math.max(0, Math.min(100, p.happy));
        p.health = Math.max(0, Math.min(100, p.health));
        p.smart = Math.max(0, Math.min(100, p.smart));
        p.looks = Math.max(0, Math.min(100, p.looks));
        p.fame = Math.max(0, Math.min(100, p.fame));

        if (p.health <= 0 && p.alive) {
            killCharacter("Gesundheitlicher Kollaps");
        }
    }

    function killCharacter(cause) {
        p.alive = false;
        document.getElementById('death-name').innerText = p.name;
        document.getElementById('death-years').innerText = `14 - ${p.age} Jahre`;
        document.getElementById('death-cause').innerText = `Todesursache: ${cause}\nGesamtvermögen: ${calculateNetWorth().toLocaleString()} $`;
        document.getElementById('death-screen').style.display = 'flex';
    }

    function triggerChoice(title, desc, options, icon = "⚡") {
        document.getElementById('choice-icon').innerText = icon;
        document.getElementById('choice-title').innerText = title;
        document.getElementById('choice-desc').innerText = desc;
        const container = document.getElementById('choice-options');
        container.innerHTML = "";

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = `choice-option-btn ${opt.style || ''}`;
            btn.innerText = opt.text;
            btn.onclick = () => {
                document.getElementById('choice-overlay').style.display = 'none';
                opt.action();
                clampStats(); updateUI();
            };
            container.appendChild(btn);
        });

        document.getElementById('choice-overlay').style.display = 'flex';
    }

    function closeView() { document.getElementById('bitlife-modal').style.display = 'none'; }

    // --- MAIN AGE UP SIMULATION ---
    function ageUp() {
        if (!p.alive) return;
        p.age++;
        p.relationships.forEach(r => r.age++);
        if (p.partner) p.partner.age++;

        // Schulabschluss
        if (p.age === 18 && p.status === "Schüler") {
            p.status = "Arbeitslos";
            addLog("🎓 Du hast die Schule abgeschlossen!", "good");
        }

        // Alterstod Check
        if (p.age > 75 && Math.random() < (p.age - 72) * 0.05) {
            killCharacter("Altersschwäche");
            return;
        }

        // Gefängnis Simulation
        if (p.inJail) {
            p.jailYears--;
            if (p.jailYears <= 0) {
                p.inJail = false;
                addLog("🔓 Du hast deine Strafe abgesessen!", "good");
            } else {
                addLog(`🔒 Noch ${p.jailYears} Jahre im Gefängnis.`, "bad");
            }
            clampStats(); updateUI(); return;
        }

        // 📈 BÖRSE
        simulateMarkets();

        // 🏢 FIRMEN
        if (p.company) simulateCompanyYear();

        // GEHALT & NEBENJOBS
        let totalIncome = p.salary + p.partTimeSalary;
        if (totalIncome > 0) {
            p.money += totalIncome;
            p.yearsInJob++;
            if (p.job !== "Arbeitslos" && p.jobPerformance > 80 && Math.random() < 0.25) {
                let raise = Math.floor(p.salary * 0.12);
                p.salary += raise;
                addLog(`🎉 Gehaltserhöhung! Neues Gehalt: ${p.salary.toLocaleString()} $`, "good");
            }
        }

        p.houses.forEach(h => {
            if (p.money >= h.upkeep) p.money -= h.upkeep;
            else { p.happy -= 8; addLog(`Kosten für ${h.type} konnten nicht gedeckt werden!`, "bad"); }
        });

        triggerRandomAgeEvent();
        addLog("Ein weiteres Lebensjahr ist vergangen.");
        clampStats(); updateUI();
    }

    function simulateMarkets() {
        let btcChange = (Math.random() - 0.47) * 0.45;
        p.portfolio.bitcoin.price = Math.max(200, Math.floor(p.portfolio.bitcoin.price * (1 + btcChange)));
    }

    function simulateCompanyYear() {
        let c = p.company;
        let netRevenue = Math.floor(c.revenue * (Math.random() * 0.5 - 0.12));
        c.valuation = Math.max(10000, Math.floor(c.valuation + netRevenue * 1.8));
        if (netRevenue > 0) {
            p.money += netRevenue;
            addLog(`🏢 ${c.name} erwirtschaftet ${netRevenue.toLocaleString()} $ Gewinn!`, "business");
        }
    }

    function triggerRandomAgeEvent() {
        let rand = Math.random();
        if (rand < 0.1) {
            triggerChoice("💰 Erbschaft", "Ein Onkel hinterlässt dir Geld!", [
                { text: "Erbe annehmen (+10.000 $)", action: () => { p.money += 10000; addLog("💰 10.000 $ geerbt!", "good"); } }
            ], "🎁");
        }
    }

    // --- MAIN VIEWS ---
    function openView(type) {
        if (!p.alive) return;
        const modal = document.getElementById('bitlife-modal');
        const title = document.getElementById('bitlife-title');
        const content = document.getElementById('bitlife-content');
        modal.style.display = 'flex';

        if (type === 'job') {
            title.innerText = "KARRIERE & JOBS";
            content.innerHTML = `
                <div class="bitlife-divider">Teilzeit & Nebenjobs (Ab 13 Jahren)</div>
                ${createActItem('⏱️', 'Teilzeitjob-Börse', p.partTimeJob ? `Aktuell: ${p.partTimeJob}` : 'Sucht einen Nebenjob', 'openPartTimeSearch()')}
                ${p.partTimeJob ? createActItem('❌', 'Teilzeitjob kündigen', '', 'quitPartTime()') : ''}
                <div class="bitlife-divider">Vollzeit-Karriere & Studium</div>
                ${p.age >= 18 && p.education !== 'Universität' ? createActItem('🎓', 'Universität', 'Studium beginnen', 'openUniMenu()') : ''}
                ${createActItem('💼', 'Vollzeit-Jobsuche', 'Offene Stellenangebote', 'openJobSearch()')}
                ${p.job !== 'Arbeitslos' ? createActItem('📈', 'Hart Arbeiten', 'Leistung steigern', 'workHard()') : ''}
                <div class="bitlife-divider">Business Empire</div>
                ${!p.company && p.age >= 18 ? createActItem('🏢', 'Firma gründen', 'Startup starten', 'openBusinessStart()') : ''}
                ${p.company ? createActItem('👔', `${p.company.name} verwalten`, 'Management', 'openCompanyManager()') : ''}
            `;
        } else if (type === 'assets') {
            title.innerText = "BESITZ & INVESTMENTS";
            content.innerHTML = `
                <div class="bitlife-divider">Börse & Crypto</div>
                ${createActItem('📈', 'Aktien & Crypto-Trading', 'Handel mit Assets', 'openStockMarket()')}
                <div class="bitlife-divider">Immobilien & Fahrzeuge</div>
                ${createActItem('🏠', 'Immobilienmarkt', 'Häuser kaufen', 'openHouses()')}
                ${createActItem('🚗', 'Autohändler', 'Autos kaufen', 'openCars()')}
            `;
        } else if (type === 'relationships') {
            title.innerText = "BEZIEHUNGEN";
            content.innerHTML = `<div class="bitlife-divider">Partner</div>`;
            if (p.partner) {
                content.innerHTML += createActItem('❤️', `${p.partner.name}`, `Beziehung: ${p.partner.rel}%`, `interactPartner()`);
            } else {
                content.innerHTML += createActItem('🔍', 'Partner suchen', 'Dates finden', 'findPartner()');
            }
            content.innerHTML += `<div class="bitlife-divider">Familie & Freunde</div>`;
            p.relationships.forEach(r => {
                content.innerHTML += createActItem('👤', `${r.name} (${r.role})`, `Alter: ${r.age}`, `interactRel(${r.id})`);
            });
        } else if (type === 'activities') {
            title.innerText = "AKTIVITÄTEN";
            content.innerHTML = `
                <div class="bitlife-divider">Gesundheit & Aussehen</div>
                ${createActItem('🏋️', 'Fitnessstudio', 'Trainieren (+Gesundheit)', 'goGym()')}
                ${createActItem('🧘', 'Yoga-Kurs', 'Macht entspannt (+Glück)', 'doYoga()')}
                ${createActItem('💇', 'Friseur & Beauty', 'Neuer Style (+Aussehen)', 'doBeauty()')}
                ${createActItem('🩺', 'Arzt besuchen', 'Krankheiten heilen (150 $)', 'visitDoctor()')}
                <div class="bitlife-divider">Lernen & Ausbildung</div>
                ${createActItem('🚗', 'Fahrschule', 'Führerschein machen (1.200 $)', 'takeDrivingLessons()')}
                ${createActItem('📚', 'Bibliothek besuchen', 'Buch lesen (+Smartness)', 'goLibrary()')}
                <div class="bitlife-divider">Freizeit & Lifestyle</div>
                ${createActItem('📱', 'Social Media', 'Posts & Viralität', 'openSocialMedia()')}
                ${createActItem('🍿', 'Kino & Ausgang', 'Spaß haben (50 $)', 'goCinema()')}
                ${createActItem('✈️', 'Auswandern', 'In neues Land ziehen', 'emigrate()')}
                <div class="bitlife-divider">Casino & Unterwelt</div>
                ${p.mafiaRank === 'Zivilist' ? createActItem('🗡️', 'Mafia beitreten', 'Syndikat beitreten', 'joinMafia()') : createActItem('🗡️', 'Mafia-Aktionen', 'Schutzgeld & Clankriege', 'openMafiaMenu()')}
                ${createActItem('🎰', 'Casino Blackjack', '1.000 $ setzen', 'openCasino()')}
            `;
        }
    }

    function createActItem(icon, title, sub, action) {
        return `
            <div class="bitlife-item" onclick="${action}">
                <div class="bitlife-item-icon">${icon}</div>
                <div class="bitlife-item-text">
                    <div class="bitlife-item-title">${title}</div>
                    <div class="bitlife-item-sub">${sub}</div>
                </div>
                <div class="bitlife-item-arrow">❯</div>
            </div>
        `;
    }

    // --- TEILZEITJOBS ---
    function openPartTimeSearch() {
        const content = document.getElementById('bitlife-content');
        content.innerHTML = `<div class="bitlife-divider">Verfügbare Teilzeitjobs</div>`;
        partTimeJobsList.forEach((j, i) => {
            content.innerHTML += createActItem('⏱️', j.title, `${j.salary.toLocaleString()} $ / Jahr (Ab ${j.reqAge} J.)`, `applyPartTime(${i})`);
        });
    }

    function applyPartTime(i) {
        let j = partTimeJobsList[i];
        if (p.age < j.reqAge) { alert(`Du musst mindestens ${j.reqAge} Jahre alt sein!`); return; }
        p.partTimeJob = j.title;
        p.partTimeSalary = j.salary;
        addLog(`⏱️ Du hast den Nebenjob als ${j.title} angenommen!`, "good");
        closeView(); updateUI();
    }

    function quitPartTime() {
        p.partTimeJob = null;
        p.partTimeSalary = 0;
        addLog("Du hast deinen Nebenjob gekündigt.");
        closeView(); updateUI();
    }

    // --- FREIZEIT & AKTIVITÄTEN ---
    function goGym() {
        closeView(); p.health = Math.min(100, p.health + 8); p.looks = Math.min(100, p.looks + 3);
        addLog("🏋️ Ausgiebig im Fitnessstudio geschwitzt (+Gesundheit, +Aussehen).", "good"); updateUI();
    }

    function doYoga() {
        closeView(); p.happy = Math.min(100, p.happy + 10); p.health = Math.min(100, p.health + 4);
        addLog("🧘 Yoga-Einheit absolviert (+Glück).", "good"); updateUI();
    }

    function doBeauty() {
        closeView();
        if (p.money >= 100) {
            p.money -= 100; p.looks = Math.min(100, p.looks + 12);
            addLog("💇 Friseurbesuch hat dein Aussehen deutlich aufgewertet!", "good");
        } else alert("Nicht genug Geld!");
        updateUI();
    }

    function goLibrary() {
        closeView(); p.smart = Math.min(100, p.smart + 7);
        addLog("📚 Stundenlang in Fachbüchern geschmökert (+Smartness).", "good"); updateUI();
    }

    function goCinema() {
        closeView();
        if (p.money >= 50) {
            p.money -= 50; p.happy = Math.min(100, p.happy + 15);
            addLog("🍿 Toller Film im Kino gesehen (+Glück)!", "good");
        } else alert("Nicht genug Geld!");
        updateUI();
    }

    function takeDrivingLessons() {
        closeView();
        if (p.hasDriverLicense) { alert("Du hast bereits einen Führerschein!"); return; }
        if (p.age < 16) { alert("Du bist noch zu jung für den Führerschein!"); return; }
        if (p.money >= 1200) {
            p.money -= 1200; p.hasDriverLicense = true;
            addLog("🚗 Führerscheinprüfung auf Anhieb bestanden!", "good");
        } else alert("Die Fahrschule kostet 1.200 $!");
        updateUI();
    }

    function emigrate() {
        closeView();
        triggerChoice("✈️ Auswandern", "In welches Land möchtest du ziehen?", [
            { text: "USA 🇺🇸 (1.500 $)", action: () => moveCountry("USA", 1500) },
            { text: "Schweiz 🇨🇭 (2.000 $)", action: () => moveCountry("Schweiz", 2000) },
            { text: "Japan 🇯🇵 (2.500 $)", action: () => moveCountry("Japan", 2500) },
            { text: "Abbrechen", action: () => {}, style: "secondary" }
        ]);
    }

    function moveCountry(c, cost) {
        if (p.money >= cost) {
            p.money -= cost; p.country = c;
            addLog(`✈️ Du bist erfolgreich nach ${c} ausgewandert!`, "good");
        } else alert("Nicht genug Geld für den Flug!");
        updateUI();
    }

    // --- STANDARD JOBS & SCHULE ---
    function openUniMenu() {
        closeView();
        triggerChoice("🎓 Universität", "Studiengang wählen:", [
            { text: "Informatik", action: () => enrollUni("Informatik") },
            { text: "Jura", action: () => enrollUni("Jura") },
            { text: "Medizin", action: () => enrollUni("Medizin") },
            { text: "BWL", action: () => enrollUni("BWL") },
            { text: "Pädagogik", action: () => enrollUni("Pädagogik") },
            { text: "Ingenieurwesen", action: () => enrollUni("Ingenieurwesen") }
        ]);
    }

    function enrollUni(major) {
        if (p.smart >= 60) {
            p.education = "Universität"; p.degree = major;
            addLog(`🎓 Für ${major} an der Universität eingeschrieben!`, "good");
        } else addLog("❌ Deine Noten reichen leider nicht aus.", "bad");
        updateUI();
    }

    function openJobSearch() {
        const content = document.getElementById('bitlife-content');
        content.innerHTML = `<div class="bitlife-divider">Karriere-Angebote</div>`;
        jobsList.forEach((j, i) => {
            content.innerHTML += createActItem('💼', j.title, `${j.salary.toLocaleString()} $ / Jahr`, `applyJob(${i})`);
        });
    }

    function applyJob(i) {
        let j = jobsList[i];
        if (j.reqDegree && p.degree !== j.reqDegree) { alert(`Abschluss benötigt: ${j.reqDegree}`); return; }
        if (j.reqLicense && !p.hasDriverLicense) { alert("Führerschein erforderlich!"); return; }
        if (p.smart >= j.reqSmart && p.looks >= j.reqLooks) {
            p.job = j.title; p.salary = j.salary;
            addLog(`🎉 Eingestellt als ${j.title}!`, "good");
        } else addLog(`❌ Absage für ${j.title}.`, "bad");
        closeView(); updateUI();
    }

    function workHard() {
        p.jobPerformance = Math.min(100, p.jobPerformance + 18);
        addLog("💼 Fleißig gearbeitet."); closeView(); updateUI();
    }

    // --- FIRMEN & BÖRSE ---
    function openBusinessStart() {
        closeView();
        if (p.money < 50000) { alert("Du brauchst mindestens 50.000 $ Startkapital!"); return; }
        triggerChoice("🏢 Firmengründung", "Wähle deine Branche:", [
            { text: "Tech-Startup (50.000 $)", action: () => startCompany("TechCorp", 50000) },
            { text: "Automobil-Konzern (250.000 $)", action: () => startCompany("HyperMotors", 250000) },
            { text: "Supermarkt-Kette (100.000 $)", action: () => startCompany("MegaMarkt", 100000) }
        ]);
    }

    function startCompany(name, cost) {
        if (p.money >= cost) {
            p.money -= cost; p.company = { name: name, valuation: cost * 2, revenue: cost, employees: 8 };
            addLog(`🏢 Firma ${name} gegründet!`, "business");
        } else alert("Zu wenig Kapital!");
        updateUI();
    }

    function openCompanyManager() {
        closeView();
        let c = p.company;
        triggerChoice(c.name, `Firmenwert: ${c.valuation.toLocaleString()} $`, [
            { text: "F&E Investment (25.000 $)", action: () => { if (p.money>=25000){ p.money-=25000; c.revenue+=50000; addLog("F&E Erfolg!", "business"); }} },
            { text: "Börsengang (IPO Verkauf)", action: () => { let payout=c.valuation; p.money+=payout; p.company=null; addLog(`🎉 BÖRSENGANG! Firma für ${payout.toLocaleString()} $ verkauft!`, "good"); }, style: "success" }
        ]);
    }

    function openStockMarket() {
        closeView();
        let btc = p.portfolio.bitcoin;
        triggerChoice("📈 Börse & Crypto", `Bitcoin: ${btc.price} $`, [
            { text: `1 Bitcoin kaufen (${btc.price} $)`, action: () => { if (p.money>=btc.price){ p.money-=btc.price; btc.shares++; addLog("Bitcoin gekauft!", "crypto"); }} },
            { text: `1 Bitcoin verkaufen (Anzahl: ${btc.shares})`, action: () => { if (btc.shares>0){ btc.shares--; p.money+=btc.price; addLog("Bitcoin verkauft!", "crypto"); }} }
        ]);
    }

    function openHouses() {
        const content = document.getElementById('bitlife-content');
        content.innerHTML = `<div class="bitlife-divider">Immobilien</div>`;
        houseShopList.forEach((h, i) => {
            content.innerHTML += createActItem('🏠', h.type, `${h.price.toLocaleString()} $`, `buyHouse(${i})`);
        });
    }

    function buyHouse(i) {
        let h = houseShopList[i];
        if (p.money >= h.price) { p.money -= h.price; p.houses.push({...h}); addLog(`🏠 ${h.type} gekauft!`, "good"); }
        else alert("Zu wenig Geld!");
        closeView(); updateUI();
    }

    function openCars() {
        const content = document.getElementById('bitlife-content');
        content.innerHTML = `<div class="bitlife-divider">Autos</div>`;
        carShopList.forEach((c, i) => {
            content.innerHTML += createActItem('🚗', c.brand, `${c.price.toLocaleString()} $`, `buyCar(${i})`);
        });
    }

    function buyCar(i) {
        let c = carShopList[i];
        if (p.money >= c.price) { p.money -= c.price; p.cars.push({...c}); addLog(`🚗 ${c.brand} gekauft!`, "good"); }
        else alert("Zu wenig Geld!");
        closeView(); updateUI();
    }

    function findPartner() {
        closeView();
        p.partner = { name: "Clara", rel: 85, age: p.age };
        addLog("❤️ Du hast eine neue Beziehung begonnen!", "love"); updateUI();
    }

    function interactPartner() {
        closeView(); p.partner.rel = Math.min(100, p.partner.rel + 12); p.happy += 8;
        addLog(`Schöne Zeit mit ${p.partner.name} verbracht.`, "love"); updateUI();
    }

    function interactRel(id) {
        let r = p.relationships.find(x => x.id === id); closeView();
        r.rel = Math.min(100, r.rel + 10); p.happy += 5;
        addLog(`Zeit mit ${r.name} verbracht.`); updateUI();
    }

    function visitDoctor() {
        closeView();
        if (p.money >= 150) { p.money -= 150; p.health = Math.min(100, p.health + 25); addLog("🏥 Arzt hat dich behandelt!", "good"); }
        else alert("Arzt kostet 150 $!");
        updateUI();
    }

    function openCasino() {
        closeView();
        if (p.money >= 1000) {
            p.money -= 1000;
            if (Math.random() > 0.47) { p.money += 2000; addLog("🎰 Blackjack gewonnen! (+2.000 $)", "good"); }
            else addLog("🎰 Geld im Casino verspielt.", "bad");
        } else alert("Einsatz: Mindestens 1.000 $!");
        updateUI();
    }

    function joinMafia() {
        closeView();
        if (Math.random() < 0.65) { p.mafiaRank = "Handlanger"; addLog("🗡️ In die Mafia aufgenommen!", "crime"); }
        else addLog("❌ Mafia hat dich abgelehnt.", "bad");
        updateUI();
    }

    function openMafiaMenu() {
        closeView();
        triggerChoice("🗡️ Mafia", `Rang: ${p.mafiaRank}`, [
            { text: "Schutzgeld eintreiben", action: () => { let e = Math.floor(Math.random()*10000)+3000; p.money+=e; addLog(`Schutzgeld: +${e} $`, "crime"); }}
        ]);
    }

    addLog("Du bist als Henri Daher auf die Welt gekommen.");
    updateUI();
</script>

</body>
</html>
