<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BitLife Web Replica</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b1928;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            background-color: #0f2337;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        /* Top Header */
        .header {
            background-color: #0a1826;
            padding: 12px 15px;
            text-align: center;
            border-bottom: 2px solid #00529b;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            color: #ffce00;
        }
        .header p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: #9bb7d4;
        }

        /* Log Box */
        .log-box {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            background: #0f2337;
            display: flex;
            flex-direction: column-reverse;
        }
        .log-entry {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.4;
            border-left: 3px solid #ffce00;
        }

        /* Middle Navigation Bar */
        .nav-bar {
            display: flex;
            background-color: #00529b;
            height: 75px;
            align-items: center;
            position: relative;
            border-top: 1px solid #0068c4;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            height: 100%;
        }
        .nav-icon {
            width: 34px;
            height: 34px;
            background-color: #00bcd4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            margin-bottom: 3px;
            color: white;
        }
        
        .nav-item.center { position: relative; z-index: 10; }
        .age-btn {
            width: 70px;
            height: 70px;
            background-color: #28a745;
            border: 4px solid #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            margin-top: -15px;
        }
        .age-btn .plus { font-size: 22px; line-height: 1; }

        /* Bottom Stats Bar */
        .stats-section {
            background-color: #0a1826;
            padding: 12px 15px;
            border-top: 1px solid #1a3048;
        }
        .stat-row { display: flex; align-items: center; margin-bottom: 6px; }
        .stat-row:last-child { margin-bottom: 0; }
        .stat-label { width: 90px; font-size: 12px; font-weight: bold; color: #d1e2f3; }
        .stat-bar-bg {
            flex-grow: 1;
            height: 10px;
            background-color: #12283e;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #1a3858;
        }
        .stat-bar-fill { height: 100%; background-color: #28a745; transition: width 0.3s ease; }

        /* Fullscreen BitLife Style View */
        .bitlife-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff;
            color: #000000;
            z-index: 200;
            flex-direction: column;
        }
        .bitlife-header {
            background: #00529b;
            color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .bitlife-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .bitlife-close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .bitlife-menu-list { flex-grow: 1; overflow-y: auto; background: #ffffff; }

        /* BitLife List Items */
        .bitlife-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            color: #000;
        }
        .bitlife-item:active { background: #f1f5f9; }
        .bitlife-item-icon { font-size: 26px; margin-right: 14px; width: 32px; text-align: center; }
        .bitlife-item-text { flex-grow: 1; }
        .bitlife-item-title { font-weight: 800; font-size: 15px; color: #00529b; }
        .bitlife-item-sub { font-size: 12px; color: #64748b; margin-top: 2px; }
        .bitlife-item-arrow { color: #00529b; font-weight: bold; font-size: 16px; }

        /* Special Category Headers */
        .bitlife-divider {
            background: #64748b;
            color: white;
            padding: 5px 15px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Relationship Progress Bar */
        .rel-bar-container {
            width: 120px;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        .rel-bar-fill { height: 100%; background: #22c55e; }

        /* Premium Banners */
        .premium-item { background: #fefce8; }
        .premium-badge {
            background: #64748b;
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <h1 id="char-name">Sariyah Daher 🏀</h1>
        <p><span id="char-job">Arbeitslos</span> | Bankguthaben: <span id="char-money">0 $</span></p>
    </div>

    <!-- Event Log -->
    <div class="log-box" id="log-box"></div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <button class="nav-item" onclick="openView('job')">
            <div class="nav-icon">💼</div>
            Tätigkeit
        </button>
        <button class="nav-item" onclick="openView('assets')">
            <div class="nav-icon">💰</div>
            Besitz
        </button>
        
        <button class="nav-item center" onclick="ageUp()">
            <div class="age-btn">
                <span class="plus">+</span>
                <span>Alter</span>
            </div>
        </button>

        <button class="nav-item" onclick="openView('relationships')">
            <div class="nav-icon">❤️</div>
            Beziehungen
        </button>
        <button class="nav-item" onclick="openView('activities')">
            <div class="nav-icon">•••</div>
            Aktivitäten
        </button>
    </div>

    <!-- Stats Table -->
    <div class="stats-section">
        <div class="stat-row">
            <span class="stat-label">Glücklich:</span>
            <div class="stat-bar-bg"><div id="bar-happy" class="stat-bar-fill"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Gesundheit:</span>
            <div class="stat-bar-bg"><div id="bar-health" class="stat-bar-fill"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Intelligenz:</span>
            <div class="stat-bar-bg"><div id="bar-smart" class="stat-bar-fill"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">Aussehen:</span>
            <div class="stat-bar-bg"><div id="bar-looks" class="stat-bar-fill"></div></div>
        </div>
    </div>

    <!-- Universal BitLife Screen Overlay -->
    <div id="bitlife-modal" class="bitlife-modal">
        <div class="bitlife-header">
            <button class="bitlife-close-btn" onclick="closeView()">✕</button>
            <h2 id="bitlife-title">MENÜ</h2>
            <div style="width:30px;"></div>
        </div>
        <div class="bitlife-menu-list" id="bitlife-content"></div>
    </div>
</div>

<script>
    let p = {
        name: "Sariyah Daher",
        age: 14,
        money: 0,
        status: "Schüler",
        job: "Arbeitslos",
        salary: 0,
        health: 85,
        happy: 70,
        smart: 80,
        looks: 75,
        alive: true,
        relationships: [
            { cat: "Eltern", name: "Yamila Daher", role: "Mutter", rel: 90, alive: true },
            { cat: "Eltern", name: "Aladdin Antoun", role: "Stiefvater", rel: 65, alive: true },
            { cat: "Geschwister", name: "Saladin Antoun", role: "Halb-Bruder", rel: 55, alive: true },
            { cat: "Geschwister", name: "Borak Antoun", role: "Halb-Bruder", rel: 25, alive: true },
            { cat: "Freunde", name: "Adham Baba", role: "Freund", rel: 10, alive: true },
            { cat: "Verstorbene", name: "Adham Antoun", role: "Halb-Bruder", rel: 0, alive: false, note: "Vor 10 Jahren gestorben" }
        ]
    };

    function updateUI() {
        document.getElementById('char-name').innerText = `${p.name} 🏀`;
        document.getElementById('char-job').innerText = p.job !== "Arbeitslos" ? p.job : p.status;
        document.getElementById('char-money').innerText = p.money + " $";

        document.getElementById('bar-happy').style.width = p.happy + "%";
        document.getElementById('bar-health').style.width = p.health + "%";
        document.getElementById('bar-smart').style.width = p.smart + "%";
        document.getElementById('bar-looks').style.width = p.looks + "%";
    }

    function addLog(text) {
        const box = document.getElementById('log-box');
        box.innerHTML = `<div class="log-entry"><strong>Alter ${p.age}:</strong> ${text}</div>` + box.innerHTML;
    }

    function ageUp() {
        if (!p.alive) return;
        p.age++;
        if (p.salary > 0) p.money += p.salary;
        addLog("Ein weiteres Jahr vergeht.");
        updateUI();
    }

    function closeView() {
        document.getElementById('bitlife-modal').style.display = 'none';
    }

    function openView(type) {
        if (!p.alive) return;
        const modal = document.getElementById('bitlife-modal');
        const title = document.getElementById('bitlife-title');
        const content = document.getElementById('bitlife-content');
        modal.style.display = 'flex';

        // 1. BEZIEHUNGEN SCREEN (Visuals Exakt wie Bild 5)
        if (type === 'relationships') {
            title.innerText = "BEZIEHUNGEN";
            content.innerHTML = "";

            const categories = ["Eltern", "Geschwister", "Freunde", "Verstorbene"];

            categories.forEach(cat => {
                const items = p.relationships.filter(r => r.cat === cat);
                if (items.length > 0) {
                    content.innerHTML += `<div class="bitlife-divider">${cat}</div>`;
                    items.forEach(r => {
                        if (r.alive) {
                            content.innerHTML += `
                                <div class="bitlife-item" onclick="interactRel('${r.name}')">
                                    <div class="bitlife-item-icon">👤</div>
                                    <div class="bitlife-item-text">
                                        <div class="bitlife-item-title">${r.name} <span style="font-weight:normal; color:#64748b;">(${r.role})</span></div>
                                        <div style="display:flex; align-items:center; gap:8px;">
                                            <span style="font-size:12px; color:#64748b;">Beziehung</span>
                                            <div class="rel-bar-container">
                                                <div class="rel-bar-fill" style="width:${r.rel}%; background:${r.rel < 40 ? '#ef4444' : '#22c55e'};"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="bitlife-item-arrow">❯</div>
                                </div>
                            `;
                        } else {
                            content.innerHTML += `
                                <div class="bitlife-item" style="opacity:0.7;">
                                    <div class="bitlife-item-icon">💀</div>
                                    <div class="bitlife-item-text">
                                        <div class="bitlife-item-title" style="color:#475569;">${r.name} <span style="font-weight:normal;">(${r.role})</span></div>
                                        <div class="bitlife-item-sub">${r.note}</div>
                                    </div>
                                    <div class="bitlife-item-arrow">• • •</div>
                                </div>
                            `;
                        }
                    });
                }
            });
        }

        // 2. AKTIVITÄTEN SCREEN (Exakt wie Bild 1, 2, 3, 4, 6)
        else if (type === 'activities') {
            title.innerText = "AKTIVITÄTEN";
            content.innerHTML = `
                <div class="bitlife-divider">Favoriten</div>
                ${createActItem('❤️', 'Liebe', 'Die große Liebe suchen', 'openLove()', '❯')}
                ${createActItem('🧘', 'Körper und Geist', 'An dir arbeiten', 'openBodyMind()', '❯')}
                ${createActItem('🐶', 'Haustiere', 'Ein Haustier anschaffen', 'addLog("Du warst im Tierheim.")', '• • •')}
                ${createActItem('💆', 'Salon und Spa', 'Zeit für dich selbst nehmen', 'addLog("Du warst im Spa.")', '❯')}

                <div class="bitlife-divider">Premium-Aktivitäten</div>
                ${createActItem('🧟', 'Albtraum des Grauens', 'Lebe ein besonderes Horrorszenario', '', '✦', true)}
                ${createActItem('🌳', 'Outdoor-Lifestyle', 'Zeit mit Mutter Natur verbringen', '', '✦', true)}
                ${createActItem('💎', 'Luxus Lifestyle', 'Vermögen aufbauen', '', '✦', true)}
                ${createActItem('🦁', 'Zoo', 'Einen Zoo kaufen', '', '✦', true)}
                ${createActItem('🕵️', 'Geheimagent', 'Gründe deine eigene Spionageagentur', '', '✦', true)}
                ${createActItem('🕶️', 'Schwarzmarkt', 'Kaufe Schmuggelware', '', '✦', true)}
                ${createActItem('🕯️', 'Kommune', 'Gründe einen Kult', '', '✦', true)}

                <div class="bitlife-divider">Alle</div>
                ${createActItem('👒', 'Accessoires', 'Lege dir coole Accessoires an', '', '❯')}
                ${createActItem('🧸', 'Adoption', 'Ein Kind adoptieren', '', '• • •')}
                ${createActItem('♠️', 'Casino', 'Das Casino besuchen', '', '• • •')}
                ${createActItem('👺', 'Kriminalität', 'Ein Verbrechen begehen', '', '❯')}
                ${createActItem('👨‍⚕️', 'Doktor', 'Zum Arzt gehen', '', '❯')}
                ${createActItem('🌐', 'Emigrieren', 'In ein anderes Land auswandern', '', '• • •')}
                ${createActItem('🧬', 'Fruchtbarkeit', 'Eine Fruchtbarkeitsklinik aufsuchen', '', '❯')}
                ${createActItem('🏇', 'Pferderennen', 'Zum Pferderennen gehen', '', '• • •')}
                ${createActItem('👤', 'Identität', 'Deine Identität definieren', '', '❯')}
                ${createActItem('⚖️', 'Gerichtsverfahren', 'Jemanden verklagen', '', '• • •')}
                ${createActItem('🚗', 'Lizenzen', 'Deine Führer-/Flugscheine verwalten', '', '❯')}
                ${createActItem('💰', 'Lotterie', 'Lotto spielen', '', '• • •')}
                ${createActItem('🎭', 'Kino', 'Ins Kino gehen', '', '❯')}
                ${createActItem('🍸', 'Nachtleben', 'In Clubs gehen', '', '• • •')}
                ${createActItem('✂️', 'Schönheitschirurgie', 'Einer Schönheits-OP unterziehen', '', '❯')}
                ${createActItem('🙏', 'Beten', 'Bete zu den BitLife-Entwicklern', 'addLog("Du hast zu den Entwicklern gebetet!")', '• • •')}
                ${createActItem('☀️', 'Entzug', 'Deine Süchte bekämpfen', '', '❯')}
                ${createActItem('🛍️', 'Bummeln', 'Shoppen gehen', '', '• • •')}
                ${createActItem('👥', 'Social Media', 'Deine Online-Identität verwalten', '', '❯')}
                ${createActItem('🎁', 'Gewinnspiel', 'Beim Gewinnspiel mitmachen', '', '• • •')}
                ${createActItem('🌪️', 'Zeitmaschine', 'In der Zeit zurückreisen', '', '• • •')}
                ${createActItem('🌴', 'Urlaub', 'In den Urlaub fahren', '', '❯')}
                ${createActItem('📝', 'Letzter Wille und Testament', 'Dein Erbe verwalten', '', '• • •')}
                ${createActItem('🦓', 'Zoobesuch', 'In den Zoo gehen', '', '• • •')}

                <div style="padding: 15px;">
                    <button onclick="addLog('🏳️ Du hast dein Leben aufgegeben.'); p.alive=false; closeView(); updateUI();" style="width:100%; padding:12px; background:#00bcd4; color:white; border:none; font-weight:bold; border-radius:6px; cursor:pointer;">🏳️ Aufgeben...</button>
                </div>
            `;
        }

        // 3. TÄTIGKEIT SCREEN
        else if (type === 'job') {
            title.innerText = "TÄTIGKEIT";
            content.innerHTML = `
                ${createActItem('🎓', 'Bildung', 'Wieder zur Schule gehen', '', '❯')}
                ${createActItem('🧢', 'Gelegenheitsjobs', 'Schnelles Geld machen', '', '❯')}
                ${createActItem('📞', 'Personalvermittler', 'Arbeitsvermittlung aufsuchen', '', '• • •')}
                ${createActItem('💵', 'Jobs', 'Vollzeitjobs durchsuchen', '', '❯')}
                ${createActItem('🛡️', 'Militär', 'Dem Militär beitreten', '', '❯')}
                ${createActItem('🕒', 'Teilzeitjobs', 'Teilzeitjobs durchsuchen', '', '❯')}
                ${createActItem('🎩', 'Besondere Karrieren', 'Spezielle Laufbahn einschlagen', '', '❯')}
                <div class="bitlife-divider">Sonstiges</div>
                ${createActItem('📓', 'Sporthistorie', 'Keine aktuelle Sporthistorie', '', '')}
            `;
        } else {
            closeView();
        }
    }

    function createActItem(icon, title, sub, action, arrow, isPremium = false) {
        return `
            <div class="bitlife-item ${isPremium ? 'premium-item' : ''}" onclick="${action}">
                <div class="bitlife-item-icon">${icon}</div>
                <div class="bitlife-item-text">
                    <div class="bitlife-item-title">${title}</div>
                    <div class="bitlife-item-sub">${sub}</div>
                </div>
                <div class="bitlife-item-arrow">${arrow}</div>
            </div>
        `;
    }

    function interactRel(name) {
        let r = p.relationships.find(item => item.name === name);
        if (r) {
            r.rel = Math.min(100, r.rel + 10);
            p.happy = Math.min(100, p.happy + 5);
            addLog(`Du hast Zeit mit ${r.name} verbracht.`);
            openView('relationships');
            updateUI();
        }
    }

    updateUI();
</script>

</body>
</html>
