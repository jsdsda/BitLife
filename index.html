<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitLife Web Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: #1e1e1e;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 { text-align: center; color: #ffce00; margin-top: 0; margin-bottom: 10px; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .stat-item { font-size: 14px; }
        .stat-value { font-weight: bold; color: #ffce00; }
        .log-box {
            height: 250px;
            background: #181818;
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 15px;
            font-size: 14px;
            border: 1px solid #333;
        }
        .log-entry { margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid #282828; }
        .btn-main {
            width: 100%;
            padding: 15px;
            background: #ffce00;
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-main:hover { background: #e6b800; }
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-action {
            padding: 12px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-action:hover { background: #444; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>BitLife Web</h1>
    
    <div class="stats-grid">
        <div class="stat-item">Name: <span id="char-name" class="stat-value">-</span></div>
        <div class="stat-item">Alter: <span id="char-age" class="stat-value">0</span></div>
        <div class="stat-item">Geld: <span id="char-money" class="stat-value">0 €</span></div>
        <div class="stat-item">Beruf: <span id="char-job" class="stat-value">Keiner</span></div>
        <div class="stat-item">Gesundheit: <span id="char-health" class="stat-value">100%</span></div>
        <div class="stat-item">Glück: <span id="char-happy" class="stat-value">100%</span></div>
        <div class="stat-item">Intelligenz: <span id="char-smart" class="stat-value">50%</span></div>
        <div class="stat-item">Aussehen: <span id="char-looks" class="stat-value">50%</span></div>
    </div>

    <div class="log-box" id="log-box"></div>

    <button class="btn-main" onclick="ageUp()">+ 1 Jahr älter werden</button>

    <div class="actions-grid">
        <button class="btn-action" onclick="readBook()">📖 Buch lesen</button>
        <button class="btn-action" onclick="workout()">🏋️ Sport machen</button>
    </div>
</div>

<script>
    let p = {
        name: "Henri",
        age: 0,
        money: 0,
        job: "Keiner",
        health: 100,
        happy: 100,
        smart: Math.floor(Math.random() * 50) + 30,
        looks: Math.floor(Math.random() * 50) + 30,
        alive: true
    };

    function updateUI() {
        document.getElementById('char-name').innerText = p.name;
        document.getElementById('char-age').innerText = p.age;
        document.getElementById('char-money').innerText = p.money + " €";
        document.getElementById('char-job').innerText = p.job;
        document.getElementById('char-health').innerText = p.health + "%";
        document.getElementById('char-happy').innerText = p.happy + "%";
        document.getElementById('char-smart').innerText = p.smart + "%";
        document.getElementById('char-looks').innerText = p.looks + "%";
    }

    function addLog(text) {
        const box = document.getElementById('log-box');
        box.innerHTML = `<div class="log-entry"><strong>Alter ${p.age}:</strong> ${text}</div>` + box.innerHTML;
    }

    function ageUp() {
        if (!p.alive) return;

        p.age++;

        let rand = Math.random();
        if (rand < 0.2) {
            p.happy = Math.min(100, p.happy + 10);
            addLog("Du hast einen tollen Tag im Park verbracht! (+Glück)");
        } else if (rand < 0.4) {
            p.health = Math.max(0, p.health - 10);
            addLog("Du hast dich erkältet... (-Gesundheit)");
        } else {
            addLog("Ein ganz normales Jahr vergeht.");
        }

        if (p.health <= 0) {
            p.alive = false;
            addLog("🪦 Du bist leider gestorben.");
        }

        updateUI();
    }

    function readBook() {
        if (!p.alive) return;
        p.smart = Math.min(100, p.smart + 5);
        addLog("Du hast ein spannendes Buch gelesen. (+Intelligenz)");
        updateUI();
    }

    function workout() {
        if (!p.alive) return;
        p.health = Math.min(100, p.health + 5);
        p.happy = Math.min(100, p.happy + 3);
        addLog("Du warst beim Sport! (+Gesundheit, +Glück)");
        updateUI();
    }

    addLog("Du wurdest geboren!");
    updateUI();
</script>

</body>
</html>
